<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec8ff" />
      <stop offset="100%" stop-color="#a5e3ff" />
    </linearGradient>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#sky)" />
  <!-- Meadow stripe -->
  <path d="M0 370 Q256 335 512 370 L512 512 L0 512 Z" fill="#6bcb77" />
  <!-- Thick border frame -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#232946" stroke-width="20" />

  <!-- Cute 2x2 Math Tiles -->
  <!-- Top-left: + (Coral) -->
  <rect x="64" y="64" width="176" height="176" rx="40" fill="#ff6b6b" stroke="#232946" stroke-width="16" />
  <path d="M152 108 V196 M108 152 H196" stroke="#ffffff" stroke-width="28" stroke-linecap="round" />

  <!-- Top-right: - (Yellow) -->
  <rect x="272" y="64" width="176" height="176" rx="40" fill="#ffd93d" stroke="#232946" stroke-width="16" />
  <path d="M316 152 H404" stroke="#232946" stroke-width="28" stroke-linecap="round" />

  <!-- Bottom-left: = (Mint) -->
  <rect x="64" y="272" width="176" height="176" rx="40" fill="#4ecdc4" stroke="#232946" stroke-width="16" />
  <path d="M110 338 H194 M110 382 H194" stroke="#232946" stroke-width="24" stroke-linecap="round" />

  <!-- Bottom-right: Cute Star / 123 (Purple) -->
  <rect x="272" y="272" width="176" height="176" rx="40" fill="#9b5de5" stroke="#232946" stroke-width="16" />
  <polygon points="360,304 376,342 418,346 386,374 396,414 360,392 324,414 334,374 302,346 344,342"
           fill="#ffd93d" stroke="#232946" stroke-width="10" stroke-linejoin="round" />
</svg>
