<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tükör Varázs! — Szimmetria és Térbeli Játék</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f06595" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MatekAppok" />
  <style>
    :root {
      --bg-top: #ff8787;
      --bg-mid: #f783ac;
      --bg-bot: #cc5de8;
      --card: #fffdf9;
      --ink: #2b2d42;
      --ink-soft: #5c647d;
      --pink: #f06595;
      --pink-dark: #c2255c;
      --teal: #20c997;
      --sun: #ffd43b;
      --green: #51cf66;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 255, 255, 0.24) 0 32px, transparent 33px),
        radial-gradient(circle at 86% 20%, rgba(255, 212, 59, 0.25) 0 42px, transparent 43px),
        radial-gradient(circle at 80% 85%, rgba(255, 255, 255, 0.16) 0 40px, transparent 41px),
        linear-gradient(170deg, var(--bg-top) 0%, var(--bg-mid) 50%, var(--bg-bot) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border-radius: 30px;
      border: 4px solid var(--ink);
      box-shadow: 0 10px 0 var(--ink), 0 20px 42px rgba(43, 45, 66, 0.26);
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .buddy-picker {
      display: flex;
      gap: 5px;
      background: #fff0f6;
      border: 2.5px solid var(--ink);
      padding: 4px;
      border-radius: 999px;
    }

    .buddy-btn {
      border: none;
      background: transparent;
      font-size: 21px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.15s;
    }

    .buddy-btn.active {
      background: var(--sun);
      transform: scale(1.1);
      box-shadow: 0 2px 0 var(--ink);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-pill {
      border: 2.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
    }

    .icon-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Mode & Range Selectors */
    .mode-bar, .range-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 9px;
    }

    .range-bar {
      margin-bottom: 11px;
    }

    .mode-btn, .range-btn {
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 9px 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .range-btn {
      padding: 7px 6px;
    }

    .mode-btn.active {
      background: var(--pink);
      color: #ffffff;
    }

    .range-btn.active {
      background: var(--teal);
      color: #ffffff;
    }

    .mode-btn:active, .range-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Progress & Streak */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #fff0f6;
      border: 2.5px solid var(--ink);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .step-dot {
      flex: 1;
      height: 11px;
      border-radius: 999px;
      background: #ffdeeb;
      transition: background 0.25s, transform 0.25s;
    }

    .step-dot.done {
      background: var(--green);
      transform: scaleY(1.15);
    }

    .step-dot.current {
      background: var(--sun);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-badge {
      background: var(--sun);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-weight: 900;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
      white-space: nowrap;
    }

    /* Stage */
    .stage {
      background: linear-gradient(180deg, #fff0f6 0%, #f8f0fc 100%);
      border-radius: 24px;
      padding: 14px 12px 16px;
      text-align: center;
      margin-bottom: 14px;
      border: 3px solid var(--ink);
    }

    .speech-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .buddy-badge {
      font-size: 34px;
      line-height: 1;
    }

    .buddy-badge.cheer {
      animation: popScale 0.45s ease;
    }

    @keyframes popScale {
      0% { transform: scale(1); }
      45% { transform: scale(1.28) rotate(-6deg); }
      100% { transform: scale(1); }
    }

    .speech-bubble {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      max-width: 460px;
    }

    /* Mirror Grid */
    .grid-wrap {
      display: inline-block;
      background: #ffffff;
      border: 3.5px solid var(--ink);
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 6px 0 rgba(43, 45, 66, 0.12);
      position: relative;
    }

    .mirror-grid {
      display: grid;
      gap: 4px;
      position: relative;
    }

    .mirror-grid.v-axis::after {
      content: "";
      position: absolute;
      top: -4px;
      bottom: -4px;
      left: 50%;
      width: 4px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        to bottom,
        var(--pink-dark) 0 8px,
        transparent 8px 14px
      );
      pointer-events: none;
      z-index: 2;
    }

    .mirror-grid.h-axis::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -4px;
      top: 50%;
      height: 4px;
      transform: translateY(-50%);
      background: repeating-linear-gradient(
        to right,
        var(--pink-dark) 0 8px,
        transparent 8px 14px
      );
      pointer-events: none;
      z-index: 2;
    }

    .cell {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 2.5px solid #dee2e6;
      background: #f8f9fa;
      cursor: pointer;
      transition: transform 0.12s, background 0.15s, border-color 0.15s;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .cell.ref {
      cursor: default;
      border-color: var(--ink);
    }

    .cell.editable:hover {
      transform: scale(1.06);
      border-color: var(--pink);
    }

    .cell.filled {
      border-color: var(--ink);
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
    }

    .cell.guide-hint {
      background: #fff9db;
    }

    .cell.wrong-cell {
      animation: shake 0.35s ease;
      box-shadow: 0 0 0 3px #ff6b6b;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    /* Action Row */
    .action-row {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .clear-btn, .check-btn {
      border: 3px solid var(--ink);
      border-radius: 20px;
      font-family: inherit;
      font-size: 18px;
      font-weight: 900;
      padding: 13px 10px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s;
    }

    .clear-btn {
      background: #ffffff;
      color: var(--ink);
    }

    .check-btn {
      background: var(--green);
      color: #ffffff;
    }

    .clear-btn:active, .check-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    /* Sticker Bar */
    .sticker-bar {
      background: #fff0f6;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sticker-label {
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .sticker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .kb-hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 800;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 45, 66, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      border-radius: 28px;
      border: 4px solid var(--ink);
      box-shadow: 0 12px 0 var(--ink);
      padding: 26px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 62px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .modal-text {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .big-play-btn {
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--pink);
      color: #ffffff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
    }

    .big-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @media (max-width: 500px) {
      .cell.size-6 { width: 38px; height: 38px; }
      .cell.size-8 { width: 31px; height: 31px; border-radius: 7px; }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <div class="top-bar">
      <div class="buddy-picker" aria-label="Válassz varázslót">
        <button class="buddy-btn active" data-buddy="🦋" title="Pillangó">🦋</button>
        <button class="buddy-btn" data-buddy="🦄" title="Unikornis">🦄</button>
        <button class="buddy-btn" data-buddy="🧙" title="Varázsló">🧙</button>
        <button class="buddy-btn" data-buddy="🐱" title="Cica">🐱</button>
      </div>

      <div class="top-controls">
        <a href="index.html" class="icon-pill" title="Vissza a főoldalra">🏠 Főoldal</a>
        <button id="toggle-helper" class="icon-pill" title="Segítő pöttyök mutatása">✨ Segítség: BE</button>
        <button id="toggle-tts" class="icon-pill" title="Motiváló hangosbemondó be vagy ki" aria-pressed="true">🗣️ Beszéd: BE</button>
        <button id="toggle-sound" class="icon-pill" title="Hang be vagy ki">🔊</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="v">↔️ Függőleges</button>
      <button class="mode-btn" data-mode="h">↕️ Vízszintes</button>
      <button class="mode-btn" data-mode="mix">🎲 Vegyes</button>
    </div>

    <div class="range-bar">
      <button class="range-btn active" data-range="4">🟦 4 × 4</button>
      <button class="range-btn" data-range="6">🟪 6 × 6</button>
      <button class="range-btn" data-range="8">🌟 8 × 8</button>
    </div>

    <div class="status-row">
      <div class="progress-track" id="progress-track"></div>
      <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>

    <section class="stage">
      <div class="speech-row">
        <div class="buddy-badge" id="buddy-badge">🦋</div>
        <div class="speech-bubble" id="speech-bubble">Tükrözd a mintát a szaggatott vonal túloldalára!</div>
      </div>

      <div class="grid-wrap">
        <div class="mirror-grid v-axis" id="mirror-grid"></div>
      </div>
    </section>

    <div class="action-row">
      <button class="clear-btn" id="clear-btn">🧹 Törlés</button>
      <button class="check-btn" id="check-btn">✅ Ellenőrzés!</button>
    </div>

    <div class="sticker-bar">
      <span class="sticker-label" id="sticker-label">🏆 Matricák (0):</span>
      <div class="sticker-list" id="sticker-list">Oldj meg 10-et egy matricáért!</div>
    </div>

    <div class="kb-hint">Tipp: Koppints a négyzetekre, majd nyomd meg az Ellenőrzés (vagy Enter) gombot!</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">🦋</div>
      <h2 class="modal-title" id="modal-title">Tükör-mester vagy!</h2>
      <p class="modal-text" id="modal-text">Megoldottál 10 feladatot és nyertél egy új matricát!</p>
      <button class="big-play-btn" id="play-again-btn">Újra! 🚀</button>
    </div>
  </div>

  <script>
    (() => {
      const ROUND_LENGTH = 10;
      const COLORS = ["#ff6b6b", "#4dabf7", "#51cf66", "#ffd43b", "#9775fa", "#ff922b"];
      const STICKERS = ["🦋", "🪞", "🦄", "🌟", "🏆", "🎨", "🌈", "🧙", "🚀", "👑", "🐱", "💎"];
      const PRAISE = [
        "Tökéletes tükörkép! 🦋✨",
        "Varázslatos szimmetria! 🪄🌟",
        "Mint egy igazi művész! 🎨🏆",
        "Telitalálat! Gyönyörű lett! 💖",
        "Szuper térlátás! 🚀"
      ];
      const ENCOURAGE = [
        "Hoppá! Nézd meg a pirossal jelölt mezőket! 👀",
        "Majdnem! Számold meg, milyen messze van a tükörvonaltól! 💪",
        "Próbáld meg újra! Figyeld a szaggatott vonalat! 🪞"
      ];

      let mode = "v"; // "v" | "h" | "mix"
      let gridSize = 4; // 4 | 6 | 8
      let buddy = "🦋";
      let showHelper = true;
      let soundOn = true;
      let ttsOn = true;

      let step = 0;
      let streak = 0;
      let locked = false;
      let axis = "v";
      let activeColor = COLORS[0];
      let targetMask = []; // boolean[r][c] for full grid
      let userMask = [];   // boolean[r][c] for full grid
      let stickers = [];

      try {
        stickers = JSON.parse(localStorage.getItem("matek_mirror_stickers") || "[]");
      } catch (_) {
        stickers = [];
      }

      const buddyBadge = document.getElementById("buddy-badge");
      const speechBubble = document.getElementById("speech-bubble");
      const mirrorGrid = document.getElementById("mirror-grid");
      const progressTrack = document.getElementById("progress-track");
      const streakBadge = document.getElementById("streak-badge");
      const stickerLabel = document.getElementById("sticker-label");
      const stickerList = document.getElementById("sticker-list");
      const modal = document.getElementById("modal");
      const modalEmoji = document.getElementById("modal-emoji");
      const modalText = document.getElementById("modal-text");
      const toggleHelperBtn = document.getElementById("toggle-helper");
      const toggleTtsBtn = document.getElementById("toggle-tts");
      const toggleSoundBtn = document.getElementById("toggle-sound");

      function speakMotivation(text, opts = {}) {
        if (!soundOn || !ttsOn || !text) return;
        try {
          if (!("speechSynthesis" in window)) return;
          const clean = String(text)
            .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!clean) return;
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = "hu-HU";
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const match = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("hu"));
          if (match) utter.voice = match;
          utter.pitch = opts.pitch ?? 1.12;
          utter.rate = opts.rate ?? 1.02;
          window.speechSynthesis.speak(utter);
        } catch (_) {}
      }

      // Web Audio
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function tone(freq, dur, type = "triangle", gainVal = 0.08, delay = 0) {
        if (!soundOn) return;
        const ctx = getCtx();
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function playPop(on) {
        tone(on ? 620 : 420, 0.06, "sine", 0.06);
      }

      function playWin() {
        tone(523, 0.09, "triangle", 0.08, 0);
        tone(659, 0.1, "triangle", 0.09, 0.08);
        tone(784, 0.16, "triangle", 0.09, 0.16);
      }

      function playWrong() {
        tone(230, 0.13, "sawtooth", 0.05, 0);
        tone(180, 0.17, "sawtooth", 0.05, 0.11);
      }

      function playFanfare() {
        [523, 659, 784, 1046].forEach((f, i) => {
          tone(f, 0.18, "triangle", 0.09, i * 0.1);
        });
      }

      // Confetti
      const canvas = document.getElementById("confetti-canvas");
      const ctx2d = canvas.getContext("2d");
      let particles = [];
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function burstConfetti(count = 45) {
        const colors = ["#f06595", "#ffd43b", "#20c997", "#4dabf7", "#51cf66"];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1
          });
        }
      }

      function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.32;
          p.rot += p.vrot;
          p.life -= 0.015;
          ctx2d.save();
          ctx2d.globalAlpha = p.life;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx2d.restore();
        }
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function isReferenceCell(r, c) {
        const half = gridSize / 2;
        return axis === "v" ? c < half : r < half;
      }

      function generatePattern() {
        axis = mode === "mix" ? (Math.random() < 0.5 ? "v" : "h") : mode;
        activeColor = COLORS[randInt(0, COLORS.length - 1)];

        targetMask = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));
        userMask = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));

        const half = gridSize / 2;
        const minFilled = Math.max(3, Math.floor((gridSize * half) * 0.35));
        const maxFilled = Math.max(minFilled + 1, Math.floor((gridSize * half) * 0.6));
        const targetCount = randInt(minFilled, maxFilled);

        let placed = 0;
        while (placed < targetCount) {
          const r = axis === "v" ? randInt(0, gridSize - 1) : randInt(0, half - 1);
          const c = axis === "v" ? randInt(0, half - 1) : randInt(0, gridSize - 1);
          if (!targetMask[r][c]) {
            targetMask[r][c] = true;
            const mr = axis === "v" ? r : gridSize - 1 - r;
            const mc = axis === "v" ? gridSize - 1 - c : c;
            targetMask[mr][mc] = true;
            userMask[r][c] = true; // Reference side is pre-filled
            placed++;
          }
        }
      }

      function renderGrid(wrongCoords = []) {
        mirrorGrid.innerHTML = "";
        mirrorGrid.className = "mirror-grid " + (axis === "v" ? "v-axis" : "h-axis");
        mirrorGrid.style.gridTemplateColumns = `repeat(${gridSize}, auto)`;

        const wrongSet = new Set(wrongCoords.map(([r, c]) => `${r},${c}`));

        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            const cell = document.createElement("button");
            cell.type = "button";
            cell.className = `cell size-${gridSize}`;
            const isRef = isReferenceCell(r, c);
            const isFilled = userMask[r][c];

            if (isRef) {
              cell.classList.add("ref");
            } else {
              cell.classList.add("editable");
              if (showHelper && targetMask[r][c] && !isFilled) {
                // Subtle dot on empty cells? No, don't give away the answer!
                // Instead, show a faint mirror-distance guide tint on alternating rows/cols
                if ((axis === "v" ? r : c) % 2 === 0) {
                  cell.classList.add("guide-hint");
                }
              }
              cell.addEventListener("click", () => {
                if (locked) return;
                userMask[r][c] = !userMask[r][c];
                playPop(userMask[r][c]);
                renderGrid();
              });
            }

            if (isFilled) {
              cell.classList.add("filled");
              cell.style.background = activeColor;
            }

            if (wrongSet.has(`${r},${c}`)) {
              cell.classList.add("wrong-cell");
            }

            mirrorGrid.appendChild(cell);
          }
        }
      }

      function renderProgress() {
        progressTrack.innerHTML = "";
        for (let i = 0; i < ROUND_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "step-dot";
          if (i < step) dot.classList.add("done");
          else if (i === step) dot.classList.add("current");
          progressTrack.appendChild(dot);
        }
        streakBadge.textContent = `🔥 ${streak}`;
      }

      function renderStickers() {
        stickerLabel.textContent = `🏆 Matricák (${stickers.length}):`;
        if (stickers.length === 0) {
          stickerList.textContent = "Oldj meg 10-et egy matricáért!";
        } else {
          stickerList.textContent = stickers.join(" ");
        }
      }

      function nextProblem() {
        locked = false;
        generatePattern();
        speechBubble.textContent = axis === "v"
          ? "Tükrözd a mintát jobbra a szaggatott vonalon át!"
          : "Tükrözd a mintát lefelé a szaggatott vonalon át!";
        renderGrid();
        renderProgress();
      }

      function checkAnswer() {
        if (locked) return;
        const wrongCoords = [];
        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            if (!isReferenceCell(r, c) && userMask[r][c] !== targetMask[r][c]) {
              wrongCoords.push([r, c]);
            }
          }
        }

        if (wrongCoords.length === 0) {
          locked = true;
          streak++;
          step++;
          buddyBadge.classList.remove("cheer");
          void buddyBadge.offsetWidth;
          buddyBadge.classList.add("cheer");

          const msg = PRAISE[randInt(0, PRAISE.length - 1)];
          speechBubble.textContent = msg;
          playWin();
          speakMotivation(msg);
          burstConfetti(40);
          renderProgress();

          setTimeout(() => {
            if (step >= ROUND_LENGTH) {
              finishRound();
            } else {
              nextProblem();
            }
          }, 1050);
        } else {
          streak = 0;
          renderGrid(wrongCoords);
          const msg = ENCOURAGE[randInt(0, ENCOURAGE.length - 1)];
          speechBubble.textContent = msg;
          playWrong();
          speakMotivation(msg, { pitch: 1.0, rate: 0.98 });
          renderProgress();
        }
      }

      function clearUserSide() {
        if (locked) return;
        for (let r = 0; r < gridSize; r++) {
          for (let c = 0; c < gridSize; c++) {
            if (!isReferenceCell(r, c)) userMask[r][c] = false;
          }
        }
        playPop(false);
        renderGrid();
      }

      function finishRound() {
        const newSticker = STICKERS[stickers.length % STICKERS.length];
        stickers.push(newSticker);
        try {
          localStorage.setItem("matek_mirror_stickers", JSON.stringify(stickers));
        } catch (_) {}
        renderStickers();
        modalEmoji.textContent = newSticker;
        modalText.textContent = `Megoldottál ${ROUND_LENGTH} feladatot és nyertél egy új matricát: ${newSticker}`;
        modal.classList.add("open");
        burstConfetti(90);
        playFanfare();
        speakMotivation("Szuper vagy! Igazi tükör-varázsló lettél, nyertél egy új matricát!");
      }

      document.getElementById("check-btn").addEventListener("click", checkAnswer);
      document.getElementById("clear-btn").addEventListener("click", clearUserSide);

      document.querySelectorAll(".buddy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".buddy-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          buddy = btn.dataset.buddy;
          buddyBadge.textContent = buddy;
          tone(520, 0.08, "triangle", 0.06);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          gridSize = Number(btn.dataset.range);
          step = 0;
          nextProblem();
        });
      });

      toggleHelperBtn.addEventListener("click", () => {
        showHelper = !showHelper;
        toggleHelperBtn.textContent = showHelper ? "✨ Segítség: BE" : "✨ Segítség: KI";
        renderGrid();
      });

      toggleTtsBtn.addEventListener("click", () => {
        ttsOn = !ttsOn;
        toggleTtsBtn.textContent = ttsOn ? "🗣️ Beszéd: BE" : "🗣️ Beszéd: KI";
        toggleTtsBtn.setAttribute("aria-pressed", String(ttsOn));
        if (!ttsOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (ttsOn) {
          speakMotivation("Szia! Tükrözzük együtt a mintákat!");
        }
      });

      toggleSoundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        toggleSoundBtn.textContent = soundOn ? "🔊" : "🔇";
        if (!soundOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (soundOn) {
          tone(600, 0.08, "triangle", 0.06);
        }
      });

      document.getElementById("play-again-btn").addEventListener("click", () => {
        modal.classList.remove("open");
        step = 0;
        nextProblem();
      });

      window.addEventListener("keydown", (e) => {
        if (modal.classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") {
            modal.classList.remove("open");
            step = 0;
            nextProblem();
          }
          return;
        }
        if (e.key === "Enter") {
          checkAnswer();
        }
      });

      renderStickers();
      nextProblem();
    })();
  </script>
</body>
</html>
