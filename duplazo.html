<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Duplázó &amp; Felező! — Duplák és Felek (1–40)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#20c997" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MatekAppok" />
  <style>
    :root {
      --bg-top: #38d9a9;
      --bg-mid: #4dabf7;
      --bg-bot: #339af0;
      --card: #fffdf9;
      --ink: #232946;
      --ink-soft: #5c647d;
      --mint: #20c997;
      --mint-dark: #0ca678;
      --orange: #ff922b;
      --sun: #ffd43b;
      --green: #51cf66;
      --coral: #ff6b6b;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.24) 0 36px, transparent 37px),
        radial-gradient(circle at 86% 20%, rgba(255, 212, 59, 0.28) 0 42px, transparent 43px),
        radial-gradient(circle at 80% 84%, rgba(255, 255, 255, 0.16) 0 40px, transparent 41px),
        linear-gradient(170deg, var(--bg-top) 0%, var(--bg-mid) 52%, var(--bg-bot) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border-radius: 30px;
      border: 4px solid var(--ink);
      box-shadow: 0 10px 0 var(--ink), 0 20px 42px rgba(35, 41, 70, 0.26);
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .buddy-picker {
      display: flex;
      gap: 5px;
      background: #e6fcf5;
      border: 2.5px solid var(--ink);
      padding: 4px;
      border-radius: 999px;
    }

    .buddy-btn {
      border: none;
      background: transparent;
      font-size: 21px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.15s;
    }

    .buddy-btn.active {
      background: var(--sun);
      transform: scale(1.1);
      box-shadow: 0 2px 0 var(--ink);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-pill {
      border: 2.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
    }

    .icon-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Mode & Range Selectors */
    .mode-bar, .range-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 9px;
    }

    .range-bar {
      margin-bottom: 11px;
    }

    .mode-btn, .range-btn {
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 9px 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .range-btn {
      padding: 7px 6px;
    }

    .mode-btn.active {
      background: var(--mint);
      color: #ffffff;
    }

    .range-btn.active {
      background: var(--orange);
      color: #ffffff;
    }

    .mode-btn:active, .range-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Progress & Streak */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #e6fcf5;
      border: 2.5px solid var(--ink);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .step-dot {
      flex: 1;
      height: 11px;
      border-radius: 999px;
      background: #c3fae8;
      transition: background 0.25s, transform 0.25s;
    }

    .step-dot.done {
      background: var(--green);
      transform: scaleY(1.15);
    }

    .step-dot.current {
      background: var(--sun);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-badge {
      background: var(--sun);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-weight: 900;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
      white-space: nowrap;
    }

    /* Machine Stage */
    .stage {
      background: linear-gradient(180deg, #e6fcf5 0%, #e7f5ff 100%);
      border-radius: 24px;
      padding: 14px 12px 16px;
      text-align: center;
      margin-bottom: 14px;
      border: 3px solid var(--ink);
    }

    .speech-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .buddy-badge {
      font-size: 34px;
      line-height: 1;
    }

    .buddy-badge.cheer {
      animation: popScale 0.45s ease;
    }

    @keyframes popScale {
      0% { transform: scale(1); }
      45% { transform: scale(1.28) rotate(-6deg); }
      100% { transform: scale(1); }
    }

    .speech-bubble {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      max-width: 460px;
    }

    .machine-flow {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .hopper-card {
      background: #ffffff;
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 12px 8px;
      min-height: 128px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 5px 0 var(--ink);
      transition: background 0.25s, transform 0.25s;
    }

    .hopper-card.solved {
      background: #ebfbee;
      transform: scale(1.03);
    }

    .hopper-card.wrong {
      background: #ffe3e3;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .hopper-label {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--ink-soft);
    }

    .hopper-num {
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      font-weight: 900;
      color: var(--ink);
      line-height: 1.1;
    }

    .hopper-num.q-box {
      background: #fff9db;
      border: 3px dashed var(--orange);
      border-radius: 14px;
      padding: 2px 14px;
      color: #d9480f;
    }

    .hopper-num.q-box.filled {
      background: var(--green);
      border-style: solid;
      border-color: var(--ink);
      color: #ffffff;
    }

    .treats-box {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      max-width: 165px;
    }

    .treat-dot {
      font-size: 15px;
      line-height: 1.1;
    }

    .machine-core {
      background: var(--sun);
      border: 3px solid var(--ink);
      border-radius: 20px;
      padding: 10px 12px;
      box-shadow: 0 5px 0 var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .machine-op {
      font-size: 24px;
      font-weight: 900;
      line-height: 1;
    }

    .machine-tag {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.4px;
    }

    /* Number Pad */
    .numpad {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      margin-bottom: 14px;
    }

    .numpad.compact {
      grid-template-columns: repeat(3, 1fr);
    }

    .num-btn {
      border: 2.5px solid var(--ink);
      border-radius: 15px;
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 10px 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .num-btn:hover {
      background: #e6fcf5;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--ink);
    }

    .num-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Sticker Bar */
    .sticker-bar {
      background: #e6fcf5;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sticker-label {
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .sticker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .kb-hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 800;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 41, 70, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      border-radius: 28px;
      border: 4px solid var(--ink);
      box-shadow: 0 12px 0 var(--ink);
      padding: 26px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 62px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .modal-text {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .big-play-btn {
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--mint);
      color: #ffffff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
    }

    .big-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @media (max-width: 520px) {
      .numpad {
        grid-template-columns: repeat(5, 1fr);
      }
      .machine-flow {
        gap: 6px;
      }
      .machine-core {
        padding: 8px 8px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <div class="top-bar">
      <div class="buddy-picker" aria-label="Válassz segítőt">
        <button class="buddy-btn active" data-buddy="🤖" title="Robot">🤖</button>
        <button class="buddy-btn" data-buddy="🦝" title="Mosómedve">🦝</button>
        <button class="buddy-btn" data-buddy="🐣" title="Csibe">🐣</button>
        <button class="buddy-btn" data-buddy="👾" title="Űrlény">👾</button>
      </div>

      <div class="top-controls">
        <a href="index.html" class="icon-pill" title="Vissza a főoldalra">🏠 Főoldal</a>
        <button id="toggle-helper" class="icon-pill" title="Sütik mutatása vagy elrejtése">🍪 Sütik: BE</button>
        <button id="toggle-tts" class="icon-pill" title="Motiváló hangosbemondó be vagy ki" aria-pressed="true">🗣️ Beszéd: BE</button>
        <button id="toggle-sound" class="icon-pill" title="Hang be vagy ki">🔊</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="double">✖️2 Duplázás</button>
      <button class="mode-btn" data-mode="half">➗2 Felezés</button>
      <button class="mode-btn" data-mode="mix">🎲 Vegyes</button>
    </div>

    <div class="range-bar">
      <button class="range-btn active" data-range="10">1 – 10</button>
      <button class="range-btn" data-range="20">1 – 20</button>
      <button class="range-btn" data-range="40">🌟 1 – 40</button>
    </div>

    <div class="status-row">
      <div class="progress-track" id="progress-track"></div>
      <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>

    <section class="stage">
      <div class="speech-row">
        <div class="buddy-badge" id="buddy-badge">🤖</div>
        <div class="speech-bubble" id="speech-bubble">Bimm-bamm! Működik a varázsgép — mennyi jön ki belőle?</div>
      </div>

      <div class="machine-flow" aria-live="polite">
        <div class="hopper-card">
          <div class="hopper-label">Bemenet</div>
          <div class="hopper-num" id="input-num">4</div>
          <div class="treats-box" id="input-treats"></div>
        </div>

        <div class="machine-core">
          <div class="machine-op" id="machine-op">✖️2</div>
          <div class="machine-tag" id="machine-tag">DUPLÁZ</div>
        </div>

        <div class="hopper-card" id="output-card">
          <div class="hopper-label" id="output-label">Kimenet</div>
          <div class="hopper-num q-box" id="output-num">?</div>
          <div class="treats-box" id="output-treats"></div>
        </div>
      </div>
    </section>

    <section class="numpad" id="numpad" aria-label="Számgombok"></section>

    <div class="sticker-bar">
      <span class="sticker-label" id="sticker-label">🏆 Matricák (0):</span>
      <div class="sticker-list" id="sticker-list">Oldj meg 10-et egy matricáért!</div>
    </div>

    <div class="kb-hint">Tipp géphez: A billentyűzeten is beírhatod a választ (pl. 12 + Enter)!</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">🤖</div>
      <h2 class="modal-title" id="modal-title">Varázsgép-mester!</h2>
      <p class="modal-text" id="modal-text">Megoldottál 10 feladatot és nyertél egy új matricát!</p>
      <button class="big-play-btn" id="play-again-btn">Újra! 🚀</button>
    </div>
  </div>

  <script>
    (() => {
      const ROUND_LENGTH = 10;
      const TREATS = ["🍪", "🧁", "🍓", "🍎", "🍩", "🍌"];
      const STICKERS = ["🤖", "🍪", "⚡", "🏆", "🚀", "🌈", "🦝", "🐣", "👾", "🌟", "👑", "🎨"];
      const PRAISE = [
        "Bimm-bamm! Tökéletes duplázás! 🤖✨",
        "Pontosan ennyi! Szuper matek! 🏆",
        "Villámgyors fejszámolás! ⚡",
        "Ügyes vagy! Igazságos osztozkodás! 🍪",
        "Zseniális! Jöhet a következő! 🚀"
      ];
      const ENCOURAGE = [
        "Hoppá! Gondold végig: dupla annyi vagy fele annyi? 👀",
        "Majdnem! Számold meg a sütiket! 🍪",
        "Próbálj egy másik számot! 💪"
      ];

      let mode = "double"; // "double" | "half" | "mix"
      let maxTotal = 10; // 10 | 20 | 40
      let buddy = "🤖";
      let showHelper = true;
      let soundOn = true;
      let ttsOn = true;

      let step = 0;
      let streak = 0;
      let locked = false;
      let taskType = "double";
      let inputVal = 4;
      let answer = 8;
      let treat = "🍪";
      let kbBuffer = "";
      let kbTimer = null;
      let stickers = [];

      try {
        stickers = JSON.parse(localStorage.getItem("matek_double_stickers") || "[]");
      } catch (_) {
        stickers = [];
      }

      const buddyBadge = document.getElementById("buddy-badge");
      const speechBubble = document.getElementById("speech-bubble");
      const inputNumEl = document.getElementById("input-num");
      const inputTreatsEl = document.getElementById("input-treats");
      const machineOpEl = document.getElementById("machine-op");
      const machineTagEl = document.getElementById("machine-tag");
      const outputCard = document.getElementById("output-card");
      const outputLabel = document.getElementById("output-label");
      const outputNumEl = document.getElementById("output-num");
      const outputTreatsEl = document.getElementById("output-treats");
      const numpad = document.getElementById("numpad");
      const progressTrack = document.getElementById("progress-track");
      const streakBadge = document.getElementById("streak-badge");
      const stickerLabel = document.getElementById("sticker-label");
      const stickerList = document.getElementById("sticker-list");
      const modal = document.getElementById("modal");
      const modalEmoji = document.getElementById("modal-emoji");
      const modalText = document.getElementById("modal-text");
      const toggleHelperBtn = document.getElementById("toggle-helper");
      const toggleTtsBtn = document.getElementById("toggle-tts");
      const toggleSoundBtn = document.getElementById("toggle-sound");

      function speakMotivation(text, opts = {}) {
        if (!soundOn || !ttsOn || !text) return;
        try {
          if (!("speechSynthesis" in window)) return;
          const clean = String(text)
            .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!clean) return;
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = "hu-HU";
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const match = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("hu"));
          if (match) utter.voice = match;
          utter.pitch = opts.pitch ?? 1.12;
          utter.rate = opts.rate ?? 1.02;
          window.speechSynthesis.speak(utter);
        } catch (_) {}
      }

      // Web Audio
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function tone(freq, dur, type = "triangle", gainVal = 0.08, delay = 0) {
        if (!soundOn) return;
        const ctx = getCtx();
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function playWin() {
        tone(523, 0.09, "triangle", 0.08, 0);
        tone(659, 0.1, "triangle", 0.09, 0.08);
        tone(784, 0.16, "triangle", 0.09, 0.16);
      }

      function playWrong() {
        tone(230, 0.13, "sawtooth", 0.05, 0);
        tone(180, 0.17, "sawtooth", 0.05, 0.11);
      }

      function playFanfare() {
        [523, 659, 784, 1046].forEach((f, i) => {
          tone(f, 0.18, "triangle", 0.09, i * 0.1);
        });
      }

      // Confetti
      const canvas = document.getElementById("confetti-canvas");
      const ctx2d = canvas.getContext("2d");
      let particles = [];
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function burstConfetti(count = 45) {
        const colors = ["#20c997", "#ffd43b", "#4dabf7", "#ff922b", "#51cf66"];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1
          });
        }
      }

      function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.32;
          p.rot += p.vrot;
          p.life -= 0.015;
          ctx2d.save();
          ctx2d.globalAlpha = p.life;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx2d.restore();
        }
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function renderTreats(container, count) {
        container.innerHTML = "";
        if (!showHelper || count > 20) return;
        for (let i = 0; i < count; i++) {
          const s = document.createElement("span");
          s.className = "treat-dot";
          s.textContent = treat;
          container.appendChild(s);
        }
      }

      function renderNumpad() {
        numpad.innerHTML = "";
        if (maxTotal <= 20) {
          numpad.classList.remove("compact");
          for (let n = 1; n <= maxTotal; n++) {
            const btn = document.createElement("button");
            btn.className = "num-btn";
            btn.textContent = String(n);
            btn.addEventListener("click", () => handleGuess(n));
            numpad.appendChild(btn);
          }
        } else {
          numpad.classList.add("compact");
          const opts = new Set([answer]);
          while (opts.size < 6) {
            const cand = Math.max(1, Math.min(40, answer + randInt(-8, 8)));
            opts.add(cand);
          }
          [...opts].sort((a, b) => a - b).forEach((n) => {
            const btn = document.createElement("button");
            btn.className = "num-btn";
            btn.textContent = String(n);
            btn.addEventListener("click", () => handleGuess(n));
            numpad.appendChild(btn);
          });
        }
      }

      function renderProgress() {
        progressTrack.innerHTML = "";
        for (let i = 0; i < ROUND_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "step-dot";
          if (i < step) dot.classList.add("done");
          else if (i === step) dot.classList.add("current");
          progressTrack.appendChild(dot);
        }
        streakBadge.textContent = `🔥 ${streak}`;
      }

      function renderStickers() {
        stickerLabel.textContent = `🏆 Matricák (${stickers.length}):`;
        if (stickers.length === 0) {
          stickerList.textContent = "Oldj meg 10-et egy matricáért!";
        } else {
          stickerList.textContent = stickers.join(" ");
        }
      }

      function nextProblem() {
        locked = false;
        kbBuffer = "";
        treat = TREATS[randInt(0, TREATS.length - 1)];
        taskType = mode === "mix" ? (Math.random() < 0.5 ? "double" : "half") : mode;

        const halfMax = maxTotal / 2;
        if (taskType === "double") {
          inputVal = randInt(1, halfMax);
          answer = inputVal * 2;
          machineOpEl.textContent = "✖️2";
          machineTagEl.textContent = "DUPLÁZ";
          outputLabel.textContent = `${inputVal} + ${inputVal}`;
          speechBubble.textContent = `Tegyünk be ${inputVal}-t! Mennyi lesz a duplája?`;
        } else {
          answer = randInt(1, halfMax);
          inputVal = answer * 2;
          machineOpEl.textContent = "➗2";
          machineTagEl.textContent = "FELEZ";
          outputLabel.textContent = "Fele";
          speechBubble.textContent = `Osszuk el igazságosan ${inputVal}-t kétfelé! Mennyi a fele?`;
        }

        outputCard.classList.remove("solved", "wrong");
        outputNumEl.classList.remove("filled");
        outputNumEl.textContent = "?";
        inputNumEl.textContent = String(inputVal);
        renderTreats(inputTreatsEl, inputVal);
        outputTreatsEl.innerHTML = "";

        renderNumpad();
        renderProgress();
      }

      function handleGuess(val) {
        if (locked) return;
        if (val === answer) {
          locked = true;
          streak++;
          step++;

          outputCard.classList.remove("wrong");
          outputCard.classList.add("solved");
          outputNumEl.classList.add("filled");
          outputNumEl.textContent = String(answer);
          renderTreats(outputTreatsEl, answer);

          buddyBadge.classList.remove("cheer");
          void buddyBadge.offsetWidth;
          buddyBadge.classList.add("cheer");

          const msg = PRAISE[randInt(0, PRAISE.length - 1)];
          speechBubble.textContent = msg;
          playWin();
          speakMotivation(msg);
          burstConfetti(35);
          renderProgress();

          setTimeout(() => {
            if (step >= ROUND_LENGTH) {
              finishRound();
            } else {
              nextProblem();
            }
          }, 1050);
        } else {
          streak = 0;
          outputCard.classList.remove("wrong");
          void outputCard.offsetWidth;
          outputCard.classList.add("wrong");

          const msg = ENCOURAGE[randInt(0, ENCOURAGE.length - 1)];
          speechBubble.textContent = msg;
          playWrong();
          speakMotivation(msg, { pitch: 1.0, rate: 0.98 });
          renderProgress();
        }
      }

      function finishRound() {
        const newSticker = STICKERS[stickers.length % STICKERS.length];
        stickers.push(newSticker);
        try {
          localStorage.setItem("matek_double_stickers", JSON.stringify(stickers));
        } catch (_) {}
        renderStickers();
        modalEmoji.textContent = newSticker;
        modalText.textContent = `Megoldottál ${ROUND_LENGTH} feladatot és nyertél egy új matricát: ${newSticker}`;
        modal.classList.add("open");
        burstConfetti(90);
        playFanfare();
        speakMotivation("Fantasztikus! A varázsgép tökéletesen működött, nyertél egy új matricát!");
      }

      document.querySelectorAll(".buddy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".buddy-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          buddy = btn.dataset.buddy;
          buddyBadge.textContent = buddy;
          tone(520, 0.08, "triangle", 0.06);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          maxTotal = Number(btn.dataset.range);
          step = 0;
          nextProblem();
        });
      });

      toggleHelperBtn.addEventListener("click", () => {
        showHelper = !showHelper;
        toggleHelperBtn.textContent = showHelper ? "🍪 Sütik: BE" : "🍪 Sütik: KI";
        renderTreats(inputTreatsEl, inputVal);
        if (locked) renderTreats(outputTreatsEl, answer);
      });

      toggleTtsBtn.addEventListener("click", () => {
        ttsOn = !ttsOn;
        toggleTtsBtn.textContent = ttsOn ? "🗣️ Beszéd: BE" : "🗣️ Beszéd: KI";
        toggleTtsBtn.setAttribute("aria-pressed", String(ttsOn));
        if (!ttsOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (ttsOn) {
          speakMotivation("Bimm-bamm! Induljon a duplázás és felezés!");
        }
      });

      toggleSoundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        toggleSoundBtn.textContent = soundOn ? "🔊" : "🔇";
        if (!soundOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (soundOn) {
          tone(600, 0.08, "triangle", 0.06);
        }
      });

      document.getElementById("play-again-btn").addEventListener("click", () => {
        modal.classList.remove("open");
        step = 0;
        nextProblem();
      });

      window.addEventListener("keydown", (e) => {
        if (modal.classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") {
            modal.classList.remove("open");
            step = 0;
            nextProblem();
          }
          return;
        }
        if (e.key >= "0" && e.key <= "9") {
          kbBuffer += e.key;
          clearTimeout(kbTimer);
          const num = parseInt(kbBuffer, 10);
          if (kbBuffer.length >= 2 || num * 10 > maxTotal) {
            kbBuffer = "";
            handleGuess(num);
          } else {
            kbTimer = setTimeout(() => {
              const val = parseInt(kbBuffer, 10);
              kbBuffer = "";
              if (!Number.isNaN(val)) handleGuess(val);
            }, 480);
          }
        } else if (e.key === "Enter" && kbBuffer) {
          clearTimeout(kbTimer);
          const val = parseInt(kbBuffer, 10);
          kbBuffer = "";
          if (!Number.isNaN(val)) handleGuess(val);
        }
      });

      renderStickers();
      nextProblem();
    })();
  </script>
</body>
</html>
