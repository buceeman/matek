<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Óra Manó! — Ismerjük meg az órát!</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#7950f2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MatekAppok" />
  <style>
    :root {
      --sky-top: #9775fa;
      --sky-mid: #748ffc;
      --sky-bot: #4c6ef5;
      --card: #fffdf7;
      --ink: #232946;
      --ink-soft: #5c647d;
      --purple: #845ef7;
      --purple-dark: #5f3dc4;
      --coral: #ff6b6b;
      --teal: #20c997;
      --sun: #ffd43b;
      --green: #51cf66;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 255, 255, 0.22) 0 18px, transparent 19px),
        radial-gradient(circle at 86% 18%, rgba(255, 212, 59, 0.3) 0 36px, transparent 37px),
        radial-gradient(circle at 82% 84%, rgba(255, 255, 255, 0.14) 0 44px, transparent 45px),
        linear-gradient(170deg, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-bot) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 100%;
      max-width: 650px;
      background: var(--card);
      border-radius: 30px;
      border: 4px solid var(--ink);
      box-shadow: 0 10px 0 var(--ink), 0 20px 42px rgba(35, 41, 70, 0.28);
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .buddy-picker {
      display: flex;
      gap: 5px;
      background: #f3f0ff;
      border: 2.5px solid var(--ink);
      padding: 4px;
      border-radius: 999px;
    }

    .buddy-btn {
      border: none;
      background: transparent;
      font-size: 21px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.15s;
    }

    .buddy-btn.active {
      background: var(--sun);
      transform: scale(1.1);
      box-shadow: 0 2px 0 var(--ink);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-pill {
      border: 2.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
    }

    .icon-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Mode & Range Selectors */
    .mode-bar, .range-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 9px;
    }

    .range-bar {
      margin-bottom: 11px;
    }

    .mode-btn, .range-btn {
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 9px 6px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .range-btn {
      padding: 7px 6px;
    }

    .mode-btn.active {
      background: var(--purple);
      color: #ffffff;
    }

    .range-btn.active {
      background: var(--teal);
      color: #ffffff;
    }

    .mode-btn:active, .range-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Progress & Streak */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f3f0ff;
      border: 2.5px solid var(--ink);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .step-dot {
      flex: 1;
      height: 11px;
      border-radius: 999px;
      background: #e5dbff;
      transition: background 0.25s, transform 0.25s;
    }

    .step-dot.done {
      background: var(--green);
      transform: scaleY(1.15);
    }

    .step-dot.current {
      background: var(--sun);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-badge {
      background: var(--sun);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-weight: 900;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
      white-space: nowrap;
    }

    /* Stage */
    .stage {
      background: linear-gradient(180deg, #f3f0ff 0%, #edf2ff 100%);
      border-radius: 24px;
      padding: 14px 12px 16px;
      text-align: center;
      margin-bottom: 14px;
      border: 3px solid var(--ink);
    }

    .speech-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .buddy-badge {
      font-size: 34px;
      line-height: 1;
    }

    .buddy-badge.cheer {
      animation: cheerPop 0.45s ease;
    }

    @keyframes cheerPop {
      0% { transform: scale(1); }
      45% { transform: scale(1.28) rotate(-6deg); }
      100% { transform: scale(1); }
    }

    .speech-bubble {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      max-width: 460px;
    }

    .target-banner {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 8px 18px;
      margin-bottom: 12px;
      box-shadow: 0 4px 0 var(--ink);
      font-size: 22px;
      font-weight: 900;
    }

    .target-banner.hidden {
      display: none;
    }

    .clock-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-svg {
      width: 230px;
      height: 230px;
      max-width: 100%;
      filter: drop-shadow(0 6px 0 rgba(35, 41, 70, 0.14));
    }

    .clock-svg.correct {
      animation: cheerPop 0.45s ease;
    }

    .clock-svg.wrong {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .hand-legend {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 800;
    }

    .hand-legend.hidden {
      display: none;
    }

    .legend-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      vertical-align: middle;
      margin-right: 4px;
    }

    /* Read Mode Choices */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .choice-grid.hidden {
      display: none;
    }

    .choice-btn {
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 22px;
      font-weight: 900;
      padding: 13px 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .choice-btn:hover {
      background: #f3f0ff;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--ink);
    }

    .choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .choice-btn.wrong {
      background: #ffe3e3;
      animation: shake 0.35s ease;
    }

    /* Set Mode Controls */
    .set-controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .set-controls.hidden {
      display: none;
    }

    .adj-btn {
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      padding: 11px 4px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s;
    }

    .adj-btn.hr { background: #ffe3e3; }
    .adj-btn.mn { background: #c3fae8; }

    .adj-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .check-btn {
      width: 100%;
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: var(--green);
      color: #ffffff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 13px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      margin-bottom: 14px;
    }

    .check-btn.hidden {
      display: none;
    }

    .check-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    /* Sticker Bar */
    .sticker-bar {
      background: #f3f0ff;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sticker-label {
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .sticker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .kb-hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 800;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 41, 70, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      border-radius: 28px;
      border: 4px solid var(--ink);
      box-shadow: 0 12px 0 var(--ink);
      padding: 26px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 62px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .modal-text {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .big-play-btn {
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--purple);
      color: #ffffff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
    }

    .big-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @media (max-width: 520px) {
      .choice-grid, .set-controls {
        grid-template-columns: repeat(2, 1fr);
      }
      .clock-svg {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <div class="top-bar">
      <div class="buddy-picker" aria-label="Válassz manót">
        <button class="buddy-btn active" data-buddy="🧚" title="Manó">🧚</button>
        <button class="buddy-btn" data-buddy="🦉" title="Bagoly">🦉</button>
        <button class="buddy-btn" data-buddy="🧙" title="Varázsló">🧙</button>
        <button class="buddy-btn" data-buddy="🐱" title="Cica">🐱</button>
      </div>

      <div class="top-controls">
        <a href="index.html" class="icon-pill" title="Vissza a főoldalra">🏠 Főoldal</a>
        <button id="toggle-helper" class="icon-pill" title="Mutató-színek és percek mutatása">🎨 Segítség: BE</button>
        <button id="toggle-tts" class="icon-pill" title="Motiváló hangosbemondó be vagy ki" aria-pressed="true">🗣️ Beszéd: BE</button>
        <button id="toggle-sound" class="icon-pill" title="Hang be vagy ki">🔊</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="read">🕒 Olvasás</button>
      <button class="mode-btn" data-mode="set">🎛️ Beállítás</button>
      <button class="mode-btn" data-mode="mix">🎲 Vegyes</button>
    </div>

    <div class="range-bar">
      <button class="range-btn active" data-range="hour">🕒 Egész órák</button>
      <button class="range-btn" data-range="half">🌗 Fél órák</button>
      <button class="range-btn" data-range="quarter">🌟 Negyed órák</button>
    </div>

    <div class="status-row">
      <div class="progress-track" id="progress-track"></div>
      <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>

    <section class="stage">
      <div class="speech-row">
        <div class="buddy-badge" id="buddy-badge">🧚</div>
        <div class="speech-bubble" id="speech-bubble">Tik-tak! Mennyi az idő az órán?</div>
      </div>

      <div class="target-banner hidden" id="target-banner">⏰ 7:00 — Reggeli!</div>

      <div class="clock-wrap">
        <svg class="clock-svg" id="clock-svg" viewBox="0 0 220 220" aria-label="Analóg óra"></svg>
      </div>

      <div class="hand-legend" id="hand-legend">
        <span><span class="legend-dot" style="background: var(--coral);"></span>Rövid = Óra</span>
        <span><span class="legend-dot" style="background: var(--teal);"></span>Hosszú = Perc</span>
      </div>
    </section>

    <section class="choice-grid" id="choice-grid" aria-label="Választható időpontok"></section>

    <section class="set-controls hidden" id="set-controls" aria-label="Óra állítása">
      <button class="adj-btn hr" id="hr-minus">-1 óra</button>
      <button class="adj-btn hr" id="hr-plus">+1 óra</button>
      <button class="adj-btn mn" id="min-minus">-15 perc</button>
      <button class="adj-btn mn" id="min-plus">+15 perc</button>
    </section>
    <button class="check-btn hidden" id="check-btn">✅ Ellenőrzés!</button>

    <div class="sticker-bar">
      <span class="sticker-label" id="sticker-label">🏆 Matricák (0):</span>
      <div class="sticker-list" id="sticker-list">Oldj meg 10-et egy matricáért!</div>
    </div>

    <div class="kb-hint">Tipp géphez: Olvasásnál nyomd az 1–4 billentyűket, beállításnál a nyilakat + Entert!</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">⏰</div>
      <h2 class="modal-title" id="modal-title">Idő-varázsló vagy!</h2>
      <p class="modal-text" id="modal-text">Megoldottál 10 feladatot és nyertél egy új matricát!</p>
      <button class="big-play-btn" id="play-again-btn">Újra! 🚀</button>
    </div>
  </div>

  <script>
    (() => {
      const ROUND_LENGTH = 10;
      const STICKERS = ["⏰", "🧚", "🌟", "🦉", "🧙", "🏆", "🚀", "🌈", "🎨", "👑", "🐱", "🕰️"];
      const EVENTS = [
        "☀️ Ébredés!",
        "🥐 Reggeli!",
        "🎒 Iskola!",
        "🍲 Ebéd!",
        "⚽ Játékidő!",
        "📖 Meseolvasás!",
        "🌙 Alvásidő!"
      ];
      const PRAISE = [
        "Tik-tak! Pontos, mint egy svájci óra! ⏰✨",
        "Szuper idő-varázsló vagy! 🧙‍♂️🌟",
        "Telitalálat! Ügyes vagy! 🏆",
        "Pontosan ennyi az idő! 🎉",
        "Villámgyors óraolvasás! ⚡"
      ];
      const ENCOURAGE = [
        "Hoppá! Nézd meg a rövid (óra) és hosszú (perc) mutatót! 👀",
        "Majdnem! A rövid mutató mutatja az órát! 💪",
        "Próbáld meg újra! Tik-tak! ⏰"
      ];

      let mode = "read"; // "read" | "set" | "mix"
      let range = "hour"; // "hour" | "half" | "quarter"
      let buddy = "🧚";
      let showHelper = true;
      let soundOn = true;
      let ttsOn = true;

      let step = 0;
      let streak = 0;
      let locked = false;
      let currentTaskMode = "read";
      let targetH = 3;
      let targetM = 0;
      let userH = 12;
      let userM = 0;
      let choices = [];
      let stickers = [];

      try {
        stickers = JSON.parse(localStorage.getItem("matek_clock_stickers") || "[]");
      } catch (_) {
        stickers = [];
      }

      const buddyBadge = document.getElementById("buddy-badge");
      const speechBubble = document.getElementById("speech-bubble");
      const targetBanner = document.getElementById("target-banner");
      const clockSvg = document.getElementById("clock-svg");
      const handLegend = document.getElementById("hand-legend");
      const choiceGrid = document.getElementById("choice-grid");
      const setControls = document.getElementById("set-controls");
      const checkBtn = document.getElementById("check-btn");
      const progressTrack = document.getElementById("progress-track");
      const streakBadge = document.getElementById("streak-badge");
      const stickerLabel = document.getElementById("sticker-label");
      const stickerList = document.getElementById("sticker-list");
      const modal = document.getElementById("modal");
      const modalEmoji = document.getElementById("modal-emoji");
      const modalText = document.getElementById("modal-text");
      const toggleHelperBtn = document.getElementById("toggle-helper");
      const toggleTtsBtn = document.getElementById("toggle-tts");
      const toggleSoundBtn = document.getElementById("toggle-sound");

      function speakMotivation(text, opts = {}) {
        if (!soundOn || !ttsOn || !text) return;
        try {
          if (!("speechSynthesis" in window)) return;
          const clean = String(text)
            .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!clean) return;
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = "hu-HU";
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const match = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("hu"));
          if (match) utter.voice = match;
          utter.pitch = opts.pitch ?? 1.12;
          utter.rate = opts.rate ?? 1.02;
          window.speechSynthesis.speak(utter);
        } catch (_) {}
      }

      // Web Audio
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function tone(freq, dur, type = "triangle", gainVal = 0.08, delay = 0) {
        if (!soundOn) return;
        const ctx = getCtx();
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function playTick() {
        tone(820, 0.04, "sine", 0.05, 0);
      }

      function playWin() {
        tone(523, 0.09, "triangle", 0.08, 0);
        tone(659, 0.1, "triangle", 0.09, 0.08);
        tone(784, 0.16, "triangle", 0.09, 0.16);
      }

      function playWrong() {
        tone(230, 0.13, "sawtooth", 0.05, 0);
        tone(180, 0.17, "sawtooth", 0.05, 0.11);
      }

      function playFanfare() {
        [523, 659, 784, 1046].forEach((f, i) => {
          tone(f, 0.18, "triangle", 0.09, i * 0.1);
        });
      }

      // Confetti
      const canvas = document.getElementById("confetti-canvas");
      const ctx2d = canvas.getContext("2d");
      let particles = [];
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function burstConfetti(count = 45) {
        const colors = ["#845ef7", "#ffd43b", "#20c997", "#ff6b6b", "#51cf66"];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1
          });
        }
      }

      function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.32;
          p.rot += p.vrot;
          p.life -= 0.015;
          ctx2d.save();
          ctx2d.globalAlpha = p.life;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx2d.restore();
        }
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function fmtTime(h, m) {
        return `${h}:${String(m).padStart(2, "0")}`;
      }

      function getAllowedMinutes() {
        if (range === "hour") return [0];
        if (range === "half") return [0, 30];
        return [0, 15, 30, 45];
      }

      function renderClock(h, m) {
        const cx = 110;
        const cy = 110;
        const r = 94;

        let ticksSvg = "";
        for (let i = 0; i < 60; i++) {
          const ang = (i * 6 - 90) * (Math.PI / 180);
          const isHour = i % 5 === 0;
          const r1 = isHour ? r - 10 : r - 5;
          const r2 = r - 2;
          const x1 = cx + r1 * Math.cos(ang);
          const y1 = cy + r1 * Math.sin(ang);
          const x2 = cx + r2 * Math.cos(ang);
          const y2 = cy + r2 * Math.sin(ang);
          ticksSvg += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#232946" stroke-width="${isHour ? 3 : 1.3}" stroke-linecap="round" opacity="${isHour ? 1 : 0.45}" />`;
        }

        let numsSvg = "";
        for (let n = 1; n <= 12; n++) {
          const ang = (n * 30 - 90) * (Math.PI / 180);
          const nr = r - 23;
          const nx = cx + nr * Math.cos(ang);
          const ny = cy + nr * Math.sin(ang);
          numsSvg += `<text x="${nx.toFixed(1)}" y="${(ny + 6).toFixed(1)}" text-anchor="middle" font-size="18" font-weight="900" fill="#232946" style="cursor:pointer" data-hour="${n}">${n}</text>`;
        }

        let minHelperSvg = "";
        if (showHelper) {
          [[12, "00"], [3, "15"], [6, "30"], [9, "45"]].forEach(([pos, lbl]) => {
            const ang = (pos * 30 - 90) * (Math.PI / 180);
            const mr = r + 11;
            const mx = cx + mr * Math.cos(ang);
            const my = cy + mr * Math.sin(ang);
            minHelperSvg += `<text x="${mx.toFixed(1)}" y="${(my + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="900" fill="#5f3dc4">${lbl}</text>`;
          });
        }

        const hourDeg = ((h % 12) + m / 60) * 30;
        const minDeg = m * 6;
        const hourColor = showHelper ? "#ff6b6b" : "#232946";
        const minColor = showHelper ? "#20c997" : "#232946";

        clockSvg.innerHTML = `
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffffff" stroke="#232946" stroke-width="5" />
          ${ticksSvg}
          ${numsSvg}
          ${minHelperSvg}
          <g transform="rotate(${hourDeg} ${cx} ${cy})">
            <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 48}" stroke="${hourColor}" stroke-width="7.5" stroke-linecap="round" />
          </g>
          <g transform="rotate(${minDeg} ${cx} ${cy})">
            <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 74}" stroke="${minColor}" stroke-width="5" stroke-linecap="round" />
          </g>
          <circle cx="${cx}" cy="${cy}" r="7.5" fill="#ffd43b" stroke="#232946" stroke-width="3" />
        `;

        if (currentTaskMode === "set") {
          clockSvg.querySelectorAll("[data-hour]").forEach((el) => {
            el.addEventListener("click", () => {
              if (locked) return;
              userH = Number(el.dataset.hour);
              playTick();
              renderClock(userH, userM);
            });
          });
        }
      }

      function renderProgress() {
        progressTrack.innerHTML = "";
        for (let i = 0; i < ROUND_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "step-dot";
          if (i < step) dot.classList.add("done");
          else if (i === step) dot.classList.add("current");
          progressTrack.appendChild(dot);
        }
        streakBadge.textContent = `🔥 ${streak}`;
      }

      function renderStickers() {
        stickerLabel.textContent = `🏆 Matricák (${stickers.length}):`;
        if (stickers.length === 0) {
          stickerList.textContent = "Oldj meg 10-et egy matricáért!";
        } else {
          stickerList.textContent = stickers.join(" ");
        }
      }

      function nextProblem() {
        locked = false;
        clockSvg.classList.remove("correct", "wrong");

        const mins = getAllowedMinutes();
        targetH = randInt(1, 12);
        targetM = mins[randInt(0, mins.length - 1)];

        currentTaskMode = mode === "mix" ? (Math.random() < 0.5 ? "read" : "set") : mode;

        if (currentTaskMode === "read") {
          targetBanner.classList.add("hidden");
          choiceGrid.classList.remove("hidden");
          setControls.classList.add("hidden");
          checkBtn.classList.add("hidden");
          speechBubble.textContent = "Tik-tak! Mennyi az idő az órán?";

          renderClock(targetH, targetM);

          const correctStr = fmtTime(targetH, targetM);
          const opts = new Set([correctStr]);
          while (opts.size < 4) {
            const rh = randInt(1, 12);
            const rm = mins[randInt(0, mins.length - 1)];
            opts.add(fmtTime(rh, rm));
          }
          choices = [...opts].sort(() => Math.random() - 0.5);
          choiceGrid.innerHTML = "";
          choices.forEach((str) => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.textContent = str;
            btn.addEventListener("click", () => handleReadChoice(str, btn));
            choiceGrid.appendChild(btn);
          });
        } else {
          targetBanner.classList.remove("hidden");
          const ev = EVENTS[randInt(0, EVENTS.length - 1)];
          targetBanner.textContent = `${ev} (${fmtTime(targetH, targetM)})`;
          choiceGrid.classList.add("hidden");
          setControls.classList.remove("hidden");
          checkBtn.classList.remove("hidden");
          speechBubble.textContent = `Állítsd be az órát erre az időre: ${fmtTime(targetH, targetM)}!`;

          userH = randInt(1, 12);
          userM = 0;
          if (userH === targetH && userM === targetM) {
            userH = (userH % 12) + 1;
          }
          renderClock(userH, userM);
        }

        handLegend.classList.toggle("hidden", !showHelper);
        renderProgress();
      }

      function onCorrect() {
        locked = true;
        streak++;
        step++;
        clockSvg.classList.add("correct");
        buddyBadge.classList.remove("cheer");
        void buddyBadge.offsetWidth;
        buddyBadge.classList.add("cheer");

        const msg = PRAISE[randInt(0, PRAISE.length - 1)];
        speechBubble.textContent = msg;
        playWin();
        speakMotivation(msg);
        burstConfetti(35);
        renderProgress();

        setTimeout(() => {
          if (step >= ROUND_LENGTH) {
            finishRound();
          } else {
            nextProblem();
          }
        }, 1050);
      }

      function onWrong(btnEl) {
        streak = 0;
        clockSvg.classList.remove("wrong");
        void clockSvg.offsetWidth;
        clockSvg.classList.add("wrong");
        if (btnEl) {
          btnEl.classList.remove("wrong");
          void btnEl.offsetWidth;
          btnEl.classList.add("wrong");
        }
        const msg = ENCOURAGE[randInt(0, ENCOURAGE.length - 1)];
        speechBubble.textContent = msg;
        playWrong();
        speakMotivation(msg, { pitch: 1.0, rate: 0.98 });
        renderProgress();
      }

      function handleReadChoice(str, btnEl) {
        if (locked) return;
        if (str === fmtTime(targetH, targetM)) {
          onCorrect();
        } else {
          onWrong(btnEl);
        }
      }

      function handleSetCheck() {
        if (locked) return;
        if (userH === targetH && userM === targetM) {
          onCorrect();
        } else {
          onWrong(null);
        }
      }

      function finishRound() {
        const newSticker = STICKERS[stickers.length % STICKERS.length];
        stickers.push(newSticker);
        try {
          localStorage.setItem("matek_clock_stickers", JSON.stringify(stickers));
        } catch (_) {}
        renderStickers();
        modalEmoji.textContent = newSticker;
        modalText.textContent = `Megoldottál ${ROUND_LENGTH} feladatot és nyertél egy új matricát: ${newSticker}`;
        modal.classList.add("open");
        burstConfetti(90);
        playFanfare();
        speakMotivation("Szuper vagy! Igazi idő-varázsló lettél, nyertél egy új matricát!");
      }

      function adjustHour(delta) {
        if (locked) return;
        userH = ((userH - 1 + delta + 12) % 12) + 1;
        playTick();
        renderClock(userH, userM);
      }

      function adjustMin(delta) {
        if (locked) return;
        const stepSize = range === "hour" ? 60 : range === "half" ? 30 : 15;
        const d = delta > 0 ? stepSize : -stepSize;
        userM = (userM + d + 60) % 60;
        playTick();
        renderClock(userH, userM);
      }

      document.getElementById("hr-minus").addEventListener("click", () => adjustHour(-1));
      document.getElementById("hr-plus").addEventListener("click", () => adjustHour(1));
      document.getElementById("min-minus").addEventListener("click", () => adjustMin(-1));
      document.getElementById("min-plus").addEventListener("click", () => adjustMin(1));
      checkBtn.addEventListener("click", handleSetCheck);

      document.querySelectorAll(".buddy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".buddy-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          buddy = btn.dataset.buddy;
          buddyBadge.textContent = buddy;
          tone(520, 0.08, "triangle", 0.06);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          range = btn.dataset.range;
          step = 0;
          nextProblem();
        });
      });

      toggleHelperBtn.addEventListener("click", () => {
        showHelper = !showHelper;
        toggleHelperBtn.textContent = showHelper ? "🎨 Segítség: BE" : "🎨 Segítség: KI";
        handLegend.classList.toggle("hidden", !showHelper);
        renderClock(currentTaskMode === "read" ? targetH : userH, currentTaskMode === "read" ? targetM : userM);
      });

      toggleTtsBtn.addEventListener("click", () => {
        ttsOn = !ttsOn;
        toggleTtsBtn.textContent = ttsOn ? "🗣️ Beszéd: BE" : "🗣️ Beszéd: KI";
        toggleTtsBtn.setAttribute("aria-pressed", String(ttsOn));
        if (!ttsOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (ttsOn) {
          speakMotivation("Tik-tak! Nézzük meg, mennyi az idő!");
        }
      });

      toggleSoundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        toggleSoundBtn.textContent = soundOn ? "🔊" : "🔇";
        if (!soundOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (soundOn) {
          tone(600, 0.08, "triangle", 0.06);
        }
      });

      document.getElementById("play-again-btn").addEventListener("click", () => {
        modal.classList.remove("open");
        step = 0;
        nextProblem();
      });

      window.addEventListener("keydown", (e) => {
        if (modal.classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") {
            modal.classList.remove("open");
            step = 0;
            nextProblem();
          }
          return;
        }
        if (currentTaskMode === "read") {
          if (["1", "2", "3", "4"].includes(e.key)) {
            const idx = Number(e.key) - 1;
            const btn = choiceGrid.children[idx];
            if (btn && choices[idx]) handleReadChoice(choices[idx], btn);
          }
        } else {
          if (e.key === "ArrowLeft") adjustHour(-1);
          else if (e.key === "ArrowRight") adjustHour(1);
          else if (e.key === "ArrowUp") adjustMin(1);
          else if (e.key === "ArrowDown") adjustMin(-1);
          else if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            handleSetCheck();
          }
        }
      });

      renderStickers();
      nextProblem();
    })();
  </script>
</body>
</html>
