<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Krokodil Kóstoló! — Kisebb, Nagyobb, Egyenlő</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#d8f8e1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MatekAppok" />
  <style>
    :root {
      --bg1: #d8f8e1;
      --bg2: #c9f0ff;
      --card: #ffffff;
      --primary: #2ec4b6;
      --primary-dark: #1f9e92;
      --green: #51cf66;
      --green-dark: #37b24d;
      --accent: #ffd93d;
      --accent-dark: #e6bc19;
      --coral: #ff6b6b;
      --coral-dark: #d94848;
      --purple: #9b5de5;
      --purple-dark: #7538c2;
      --text: #232946;
      --muted: #6c757d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 28px;
      border: 4px solid #ffffff;
      box-shadow: 0 14px 35px rgba(35, 41, 70, 0.14);
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .buddy-picker {
      display: flex;
      gap: 6px;
      background: #f4f7fb;
      padding: 5px;
      border-radius: 999px;
    }

    .buddy-btn {
      border: none;
      background: transparent;
      font-size: 22px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.15s;
    }

    .buddy-btn.active {
      background: var(--accent);
      transform: scale(1.12);
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .icon-pill {
      border: none;
      background: #f4f7fb;
      color: var(--text);
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s;
      text-decoration: none;
    }

    .icon-pill:active {
      transform: scale(0.95);
    }

    /* Mode & Range Selectors */
    .mode-bar, .range-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .mode-btn, .range-btn {
      border: none;
      border-radius: 16px;
      padding: 10px 6px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: #f1f3f5;
      color: var(--text);
      box-shadow: 0 4px 0 #dee2e6;
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .range-btn {
      padding: 8px 6px;
      font-size: 14px;
    }

    .mode-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 0 var(--primary-dark);
    }

    .range-btn.active {
      background: var(--purple);
      color: #ffffff;
      box-shadow: 0 4px 0 var(--purple-dark);
    }

    .mode-btn:active, .range-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #dee2e6;
    }

    /* Progress & Streak */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f4f7fb;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .step-dot {
      flex: 1;
      height: 12px;
      border-radius: 999px;
      background: #dfe4ea;
      transition: background 0.25s, transform 0.25s;
    }

    .step-dot.done {
      background: var(--green);
      transform: scaleY(1.15);
    }

    .step-dot.current {
      background: var(--accent);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-badge {
      background: #fff0e6;
      color: #e8590c;
      font-weight: 800;
      font-size: 14px;
      padding: 6px 11px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Stage */
    .stage {
      background: linear-gradient(180deg, #eafff2 0%, #eef9ff 100%);
      border-radius: 24px;
      padding: 14px 12px 16px;
      text-align: center;
      margin-bottom: 14px;
      border: 3px solid #d5f5e3;
      position: relative;
    }

    .speech-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .buddy-badge {
      font-size: 34px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .buddy-badge.chomp {
      animation: chompBounce 0.45s ease;
    }

    @keyframes chompBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.3) rotate(-8deg); }
      70% { transform: scale(0.95) rotate(6deg); }
      100% { transform: scale(1); }
    }

    .speech-bubble {
      background: #ffffff;
      border: 2.5px solid #cdeed9;
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      max-width: 420px;
    }

    /* Comparison Arena */
    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .side-card {
      background: #ffffff;
      border: 3px solid #d8e2dc;
      border-radius: 22px;
      padding: 14px 8px;
      min-height: 132px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 0 rgba(35, 41, 70, 0.07);
      transition: transform 0.25s, border-color 0.25s, background 0.25s;
    }

    .side-card.winner {
      border-color: var(--green);
      background: #f0fff4;
      transform: scale(1.04);
    }

    .side-card.shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .side-value {
      font-size: clamp(1.85rem, 6vw, 2.7rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--text);
    }

    .side-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      max-width: 150px;
      min-height: 22px;
    }

    .food-dot {
      font-size: 16px;
      line-height: 1.1;
    }

    .tens-block {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #e9ecef;
      border: 1.5px solid #adb5bd;
      border-radius: 6px;
      padding: 2px 5px;
      font-size: 11px;
      font-weight: 800;
      color: #495057;
    }

    /* Center Croc Mouth */
    .croc-center {
      width: 92px;
      height: 92px;
      background: #ffffff;
      border: 3px solid var(--text);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 var(--text);
      position: relative;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
    }

    .croc-center.correct {
      background: #d3f9d8;
      transform: scale(1.1);
    }

    .croc-center.wrong {
      background: #ffe3e3;
      animation: shake 0.35s ease;
    }

    .croc-symbol {
      font-size: 46px;
      font-weight: 900;
      line-height: 1;
      color: var(--text);
    }

    .croc-svg {
      width: 74px;
      height: 74px;
      display: block;
    }

    /* Action Buttons */
    .choice-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .choice-btn {
      border: 3px solid var(--text);
      border-radius: 22px;
      padding: 14px 8px;
      background: var(--accent);
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--text);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .choice-btn.lt { background: #74c0fc; }
    .choice-btn.eq { background: #ffd93d; }
    .choice-btn.gt { background: #8ce99a; }

    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 var(--text);
    }

    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--text);
    }

    .choice-sign {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .choice-hint {
      font-size: 13px;
      font-weight: 800;
      opacity: 0.85;
    }

    /* Sticker Bar */
    .sticker-bar {
      background: #f8f9fa;
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sticker-label {
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
    }

    .sticker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      color: var(--muted);
      font-weight: 700;
    }

    .kb-hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(35, 41, 70, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 28px;
      border: 4px solid var(--text);
      box-shadow: 0 12px 0 var(--text);
      padding: 26px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 62px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .modal-text {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
    }

    .big-play-btn {
      border: 3px solid var(--text);
      border-radius: 999px;
      background: var(--green);
      color: var(--text);
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--text);
      transition: transform 0.1s;
    }

    .big-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--text);
    }

    @media (max-width: 460px) {
      .arena {
        gap: 6px;
      }
      .croc-center {
        width: 74px;
        height: 74px;
        border-radius: 18px;
      }
      .croc-svg {
        width: 58px;
        height: 58px;
      }
      .choice-sign {
        font-size: 34px;
      }
      .choice-hint {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <div class="top-bar">
      <div class="buddy-picker" aria-label="Válassz kóstolót">
        <button class="buddy-btn active" data-buddy="🐊" title="Kroki">🐊</button>
        <button class="buddy-btn" data-buddy="🦖" title="Dínó">🦖</button>
        <button class="buddy-btn" data-buddy="🦈" title="Cápa">🦈</button>
        <button class="buddy-btn" data-buddy="🐉" title="Sárkány">🐉</button>
      </div>

      <div class="top-controls">
        <a href="index.html" class="icon-pill" title="Vissza a főoldalra">🏠 Főoldal</a>
        <button id="toggle-helper" class="icon-pill" title="Pöttyök mutatása vagy elrejtése">🍎 Pöttyök: BE</button>
        <button id="toggle-sound" class="icon-pill" title="Hang be vagy ki">🔊</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="num">🔢 Számok</button>
      <button class="mode-btn" data-mode="sum">➕ Összegek</button>
      <button class="mode-btn" data-mode="mix">🎲 Vegyes</button>
    </div>

    <div class="range-bar">
      <button class="range-btn active" data-range="1-10">1 – 10</button>
      <button class="range-btn" data-range="1-20">1 – 20</button>
      <button class="range-btn" data-range="1-100">🌟 1 – 100</button>
    </div>

    <div class="status-row">
      <div class="progress-track" id="progress-track"></div>
      <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>

    <section class="stage">
      <div class="speech-row">
        <div class="buddy-badge" id="buddy-badge">🐊</div>
        <div class="speech-bubble" id="speech-bubble">Hamm! A krokodil szája mindig a NAGYOBB felé nyílik!</div>
      </div>

      <div class="arena" aria-live="polite">
        <div class="side-card" id="left-card">
          <div class="side-value" id="left-val">5</div>
          <div class="side-dots" id="left-dots"></div>
        </div>

        <div class="croc-center" id="croc-center">
          <span class="croc-symbol" id="croc-symbol">?</span>
        </div>

        <div class="side-card" id="right-card">
          <div class="side-value" id="right-val">8</div>
          <div class="side-dots" id="right-dots"></div>
        </div>
      </div>
    </section>

    <section class="choice-row" aria-label="Válassz jelet">
      <button class="choice-btn lt" data-choice="<">
        <span class="choice-sign">&lt;</span>
        <span class="choice-hint">A jobb nagyobb</span>
      </button>
      <button class="choice-btn eq" data-choice="=">
        <span class="choice-sign">=</span>
        <span class="choice-hint">Egyenlő</span>
      </button>
      <button class="choice-btn gt" data-choice=">">
        <span class="choice-sign">&gt;</span>
        <span class="choice-hint">A bal nagyobb</span>
      </button>
    </section>

    <div class="sticker-bar">
      <span class="sticker-label" id="sticker-label">🏆 Matricák (0):</span>
      <div class="sticker-list" id="sticker-list">Oldj meg 10-et egy matricáért!</div>
    </div>

    <div class="kb-hint">Tipp géphez: Használd a ◀, ▼ (vagy Space) és ▶ billentyűket is!</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">🐊</div>
      <h2 class="modal-title" id="modal-title">Kroki jóllakott!</h2>
      <p class="modal-text" id="modal-text">Megoldottál 10 feladatot és nyertél egy új matricát!</p>
      <button class="big-play-btn" id="play-again-btn">Újra! 🚀</button>
    </div>
  </div>

  <script>
    (() => {
      const ROUND_LENGTH = 10;
      const FOOD_ICONS = ["🍎", "🍓", "🍉", "🍪", "🧁", "🍌", "🍇", "🐟"];
      const STICKERS = ["🐊", "👑", "🚀", "🌈", "🍉", "🏆", "🦖", "🦈", "🌟", "🎨", "⚽", "🍕"];
      const PRAISE = [
        "Hamm! Pont a finomabb falat! 🐊",
        "Szuper szemmérték! 👀✨",
        "Kroki-bajnok! 🏆",
        "Telitalálat! Jöhet a következő! 🚀",
        "Ügyes vagy! Nyami! 🍎",
        "Villámgyors matek! ⚡",
        "Zseniális! 🌟"
      ];
      const ENCOURAGE = [
        "Hoppá! Melyik oldalon van több? Nézd meg jól! 👀",
        "Majdnem! A krokodil a NAGYOBBAT akarja megenni! 🐊",
        "Próbáld újra! Számold meg a pöttyöket! 💪"
      ];

      let mode = "num"; // "num" | "sum" | "mix"
      let range = "1-10"; // "1-10" | "1-20" | "1-100"
      let buddy = "🐊";
      let showHelper = true;
      let soundOn = true;

      let step = 0;
      let streak = 0;
      let locked = false;
      let leftVal = 0;
      let rightVal = 0;
      let leftText = "";
      let rightText = "";
      let foodIcon = "🍎";
      let stickers = [];

      try {
        stickers = JSON.parse(localStorage.getItem("matek_croc_stickers") || "[]");
      } catch (_) {
        stickers = [];
      }

      const buddyBadge = document.getElementById("buddy-badge");
      const speechBubble = document.getElementById("speech-bubble");
      const leftCard = document.getElementById("left-card");
      const rightCard = document.getElementById("right-card");
      const leftValEl = document.getElementById("left-val");
      const rightValEl = document.getElementById("right-val");
      const leftDots = document.getElementById("left-dots");
      const rightDots = document.getElementById("right-dots");
      const crocCenter = document.getElementById("croc-center");
      const crocSymbol = document.getElementById("croc-symbol");
      const progressTrack = document.getElementById("progress-track");
      const streakBadge = document.getElementById("streak-badge");
      const stickerLabel = document.getElementById("sticker-label");
      const stickerList = document.getElementById("sticker-list");
      const modal = document.getElementById("modal");
      const modalEmoji = document.getElementById("modal-emoji");
      const modalText = document.getElementById("modal-text");
      const toggleHelperBtn = document.getElementById("toggle-helper");
      const toggleSoundBtn = document.getElementById("toggle-sound");

      // Web Audio
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function tone(freq, dur, type = "triangle", gainVal = 0.08, delay = 0) {
        if (!soundOn) return;
        const ctx = getCtx();
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function playChompWin() {
        tone(340, 0.08, "square", 0.06, 0);
        tone(523, 0.11, "triangle", 0.09, 0.07);
        tone(659, 0.12, "triangle", 0.09, 0.16);
        tone(784, 0.18, "triangle", 0.09, 0.25);
      }

      function playWrong() {
        tone(240, 0.14, "sawtooth", 0.05, 0);
        tone(190, 0.18, "sawtooth", 0.05, 0.12);
      }

      function playFanfare() {
        [523, 659, 784, 1046].forEach((f, i) => {
          tone(f, 0.18, "triangle", 0.09, i * 0.1);
        });
      }

      // Confetti
      const canvas = document.getElementById("confetti-canvas");
      const ctx2d = canvas.getContext("2d");
      let particles = [];
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function burstConfetti(count = 45) {
        const colors = ["#ff6b6b", "#ffd93d", "#51cf66", "#4ecdc4", "#9b5de5"];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1
          });
        }
      }

      function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.32;
          p.rot += p.vrot;
          p.life -= 0.015;
          ctx2d.save();
          ctx2d.globalAlpha = p.life;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx2d.restore();
        }
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getMaxRange() {
        if (range === "1-10") return 10;
        if (range === "1-20") return 20;
        return 100;
      }

      function makeSide(useSum, maxNum) {
        if (!useSum) {
          const val = randInt(1, maxNum);
          return { val, text: String(val) };
        }
        const target = randInt(2, maxNum);
        const a = randInt(1, target - 1);
        const b = target - a;
        return { val: target, text: `${a} + ${b}` };
      }

      function renderDots(container, val) {
        container.innerHTML = "";
        if (!showHelper) return;

        if (val <= 20) {
          for (let i = 0; i < val; i++) {
            const span = document.createElement("span");
            span.className = "food-dot";
            span.textContent = foodIcon;
            container.appendChild(span);
          }
        } else {
          // For 1-100: show tens blocks + ones dots
          const tens = Math.floor(val / 10);
          const ones = val % 10;
          for (let i = 0; i < tens; i++) {
            const blk = document.createElement("span");
            blk.className = "tens-block";
            blk.textContent = "10";
            container.appendChild(blk);
          }
          for (let i = 0; i < ones; i++) {
            const span = document.createElement("span");
            span.className = "food-dot";
            span.textContent = "•";
            container.appendChild(span);
          }
        }
      }

      function renderProgress() {
        progressTrack.innerHTML = "";
        for (let i = 0; i < ROUND_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "step-dot";
          if (i < step) dot.classList.add("done");
          else if (i === step) dot.classList.add("current");
          progressTrack.appendChild(dot);
        }
        streakBadge.textContent = `🔥 ${streak}`;
      }

      function renderStickers() {
        stickerLabel.textContent = `🏆 Matricák (${stickers.length}):`;
        if (stickers.length === 0) {
          stickerList.textContent = "Oldj meg 10-et egy matricáért!";
        } else {
          stickerList.textContent = stickers.join(" ");
        }
      }

      function nextProblem() {
        locked = false;
        const maxNum = getMaxRange();
        foodIcon = FOOD_ICONS[randInt(0, FOOD_ICONS.length - 1)];

        leftCard.classList.remove("winner", "shake");
        rightCard.classList.remove("winner", "shake");
        crocCenter.classList.remove("correct", "wrong");
        crocSymbol.textContent = "?";

        const forceEqual = Math.random() < 0.22;
        const leftIsSum = mode === "sum" || (mode === "mix" && Math.random() < 0.5);
        const rightIsSum = mode === "sum" || (mode === "mix" && Math.random() < 0.5);

        const left = makeSide(leftIsSum, maxNum);
        let right;

        if (forceEqual) {
          if (rightIsSum && left.val >= 2) {
            const a = randInt(1, left.val - 1);
            right = { val: left.val, text: `${a} + ${left.val - a}` };
          } else {
            right = { val: left.val, text: String(left.val) };
          }
        } else {
          right = makeSide(rightIsSum, maxNum);
          // Avoid accidental equality too often when not forced, or keep it fair
        }

        leftVal = left.val;
        rightVal = right.val;
        leftText = left.text;
        rightText = right.text;

        leftValEl.textContent = leftText;
        rightValEl.textContent = rightText;
        renderDots(leftDots, leftVal);
        renderDots(rightDots, rightVal);
        renderProgress();
      }

      function handleChoice(choice) {
        if (locked) return;

        let expected = "=";
        if (leftVal < rightVal) expected = "<";
        else if (leftVal > rightVal) expected = ">";

        if (choice === expected) {
          locked = true;
          streak++;
          step++;
          crocSymbol.textContent = expected;
          crocCenter.classList.remove("wrong");
          crocCenter.classList.add("correct");

          if (expected === ">") leftCard.classList.add("winner");
          else if (expected === "<") rightCard.classList.add("winner");
          else {
            leftCard.classList.add("winner");
            rightCard.classList.add("winner");
          }

          buddyBadge.classList.remove("chomp");
          void buddyBadge.offsetWidth;
          buddyBadge.classList.add("chomp");

          speechBubble.textContent = PRAISE[randInt(0, PRAISE.length - 1)];
          playChompWin();
          burstConfetti(35);
          renderProgress();

          setTimeout(() => {
            if (step >= ROUND_LENGTH) {
              finishRound();
            } else {
              nextProblem();
            }
          }, 950);
        } else {
          streak = 0;
          crocCenter.classList.remove("wrong");
          void crocCenter.offsetWidth;
          crocCenter.classList.add("wrong");
          leftCard.classList.add("shake");
          rightCard.classList.add("shake");
          setTimeout(() => {
            leftCard.classList.remove("shake");
            rightCard.classList.remove("shake");
          }, 380);
          speechBubble.textContent = ENCOURAGE[randInt(0, ENCOURAGE.length - 1)];
          playWrong();
          renderProgress();
        }
      }

      function finishRound() {
        const newSticker = STICKERS[stickers.length % STICKERS.length];
        stickers.push(newSticker);
        try {
          localStorage.setItem("matek_croc_stickers", JSON.stringify(stickers));
        } catch (_) {}
        renderStickers();
        modalEmoji.textContent = newSticker;
        modalText.textContent = `Megoldottál ${ROUND_LENGTH} feladatot és nyertél egy új matricát: ${newSticker}`;
        modal.classList.add("open");
        burstConfetti(90);
        playFanfare();
      }

      // Event Listeners
      document.querySelectorAll(".buddy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".buddy-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          buddy = btn.dataset.buddy;
          buddyBadge.textContent = buddy;
          tone(520, 0.08, "triangle", 0.06);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          range = btn.dataset.range;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.addEventListener("click", () => handleChoice(btn.dataset.choice));
      });

      toggleHelperBtn.addEventListener("click", () => {
        showHelper = !showHelper;
        toggleHelperBtn.textContent = showHelper ? "🍎 Pöttyök: BE" : "🍎 Pöttyök: KI";
        renderDots(leftDots, leftVal);
        renderDots(rightDots, rightVal);
      });

      toggleSoundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        toggleSoundBtn.textContent = soundOn ? "🔊" : "🔇";
        if (soundOn) tone(600, 0.08, "triangle", 0.06);
      });

      document.getElementById("play-again-btn").addEventListener("click", () => {
        modal.classList.remove("open");
        step = 0;
        nextProblem();
      });

      window.addEventListener("keydown", (e) => {
        if (modal.classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") {
            modal.classList.remove("open");
            step = 0;
            nextProblem();
          }
          return;
        }
        if (e.key === "ArrowLeft" || e.key === "<") {
          handleChoice("<");
        } else if (e.key === "ArrowRight" || e.key === ">") {
          handleChoice(">");
        } else if (e.key === "ArrowDown" || e.key === "=" || e.key === " ") {
          e.preventDefault();
          handleChoice("=");
        }
      });

      renderStickers();
      nextProblem();
    })();
  </script>
</body>
</html>
