<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Krokodil Kóstoló! — Kisebb, Nagyobb, Egyenlő</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#12b886" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MatekAppok" />
  <style>
    :root {
      --water-top: #12b886;
      --water-mid: #15aabf;
      --water-deep: #0b7285;
      --bamboo: #fff9e6;
      --ink: #1b4332;
      --ink-soft: #406856;
      --leaf: #40c057;
      --leaf-dark: #2b8a3e;
      --sun: #ffd43b;
      --sun-dark: #e6b400;
      --berry: #ff6b6b;
      --berry-dark: #d94848;
      --lagoon: #d3f9d8;
      --lagoon-2: #c5f6fa;
      --wood: #f3d9b1;
      --wood-border: #b07d4f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.16) 0 42px, transparent 43px),
        radial-gradient(circle at 88% 22%, rgba(255, 255, 255, 0.14) 0 58px, transparent 59px),
        radial-gradient(circle at 18% 85%, rgba(105, 219, 124, 0.28) 0 48px, transparent 49px),
        radial-gradient(circle at 85% 82%, rgba(105, 219, 124, 0.25) 0 54px, transparent 55px),
        linear-gradient(170deg, var(--water-top) 0%, var(--water-mid) 52%, var(--water-deep) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 100%;
      max-width: 640px;
      background: var(--bamboo);
      border-radius: 30px;
      border: 4px solid var(--ink);
      box-shadow: 0 10px 0 var(--ink), 0 20px 40px rgba(11, 114, 133, 0.35);
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .buddy-picker {
      display: flex;
      gap: 5px;
      background: #e6fcf5;
      border: 2.5px solid var(--ink);
      padding: 4px;
      border-radius: 999px;
    }

    .buddy-btn {
      border: none;
      background: transparent;
      font-size: 21px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.15s;
    }

    .buddy-btn.active {
      background: var(--sun);
      transform: scale(1.1);
      box-shadow: 0 2px 0 var(--ink);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-pill {
      border: 2.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
    }

    .icon-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Mode & Range Selectors */
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 9px;
    }

    .range-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 11px;
    }

    .mode-btn, .range-btn {
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 9px 4px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .range-btn {
      padding: 7px 6px;
    }

    .mode-btn.active {
      background: var(--leaf);
      color: #ffffff;
    }

    .range-btn.active {
      background: #3bc9db;
      color: var(--ink);
    }

    .mode-btn:active, .range-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Progress & Streak */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #e6fcf5;
      border: 2.5px solid var(--ink);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .step-dot {
      flex: 1;
      height: 11px;
      border-radius: 999px;
      background: #c3fae8;
      transition: background 0.25s, transform 0.25s;
    }

    .step-dot.done {
      background: var(--leaf);
      transform: scaleY(1.15);
    }

    .step-dot.current {
      background: var(--sun);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-badge {
      background: var(--sun);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-weight: 900;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
      white-space: nowrap;
    }

    /* Lagoon Stage */
    .stage {
      background: linear-gradient(180deg, var(--lagoon-2) 0%, var(--lagoon) 100%);
      border-radius: 24px;
      padding: 14px 12px 16px;
      text-align: center;
      margin-bottom: 14px;
      border: 3px solid var(--ink);
      position: relative;
      overflow: hidden;
    }

    .speech-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .buddy-badge {
      font-size: 34px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .buddy-badge.chomp {
      animation: chompBounce 0.45s ease;
    }

    @keyframes chompBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.3) rotate(-8deg); }
      70% { transform: scale(0.95) rotate(6deg); }
      100% { transform: scale(1); }
    }

    .speech-bubble {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(27, 67, 50, 0.15);
      max-width: 440px;
    }

    /* Comparison Arena */
    .arena {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .side-card {
      background: var(--wood);
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 14px 8px;
      min-height: 136px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 0 var(--wood-border);
      transition: transform 0.25s, border-color 0.25s, background 0.25s;
    }

    .side-card.winner {
      border-color: var(--leaf-dark);
      background: #ebfbee;
      box-shadow: 0 6px 0 var(--leaf-dark);
      transform: scale(1.04);
    }

    .side-card.shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .side-value {
      font-size: clamp(1.75rem, 5.5vw, 2.55rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      padding: 4px 12px;
      border-radius: 14px;
    }

    .side-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      max-width: 160px;
      min-height: 22px;
    }

    .food-dot {
      font-size: 16px;
      line-height: 1.1;
    }

    .tens-block {
      display: inline-flex;
      align-items: center;
      background: #ffffff;
      border: 2px solid var(--ink);
      border-radius: 6px;
      padding: 1px 5px;
      font-size: 11px;
      font-weight: 900;
      color: var(--ink);
    }

    /* Center Animated Croc Mouth */
    .croc-center {
      width: 98px;
      height: 98px;
      background: #ffffff;
      border: 3px solid var(--ink);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 0 var(--ink);
      position: relative;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
    }

    .croc-center.correct {
      background: #b2f2bb;
      transform: scale(1.1);
    }

    .croc-center.wrong {
      background: #ffc9c9;
      animation: shake 0.35s ease;
    }

    .croc-svg {
      width: 82px;
      height: 82px;
      display: block;
    }

    .croc-sign-badge {
      position: absolute;
      bottom: -10px;
      background: var(--sun);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 1px 10px;
      font-size: 18px;
      font-weight: 900;
      line-height: 1.2;
      box-shadow: 0 2px 0 var(--ink);
    }

    /* Action Buttons */
    .choice-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .choice-btn {
      border: 3px solid var(--ink);
      border-radius: 22px;
      padding: 12px 8px;
      color: var(--ink);
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .choice-btn.lt { background: #74c0fc; }
    .choice-btn.eq { background: var(--sun); }
    .choice-btn.gt { background: #8ce99a; }

    .choice-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 var(--ink);
    }

    .choice-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .choice-sign {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    .choice-hint {
      font-size: 12.5px;
      font-weight: 800;
      opacity: 0.9;
    }

    /* Sticker Bar */
    .sticker-bar {
      background: #e6fcf5;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sticker-label {
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .sticker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .kb-hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 800;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(27, 67, 50, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--bamboo);
      border-radius: 28px;
      border: 4px solid var(--ink);
      box-shadow: 0 12px 0 var(--ink);
      padding: 26px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 62px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .modal-text {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .big-play-btn {
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--leaf);
      color: #ffffff;
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s;
    }

    .big-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @media (max-width: 520px) {
      .mode-bar {
        grid-template-columns: repeat(2, 1fr);
      }
      .arena {
        gap: 6px;
      }
      .croc-center {
        width: 78px;
        height: 78px;
        border-radius: 20px;
      }
      .croc-svg {
        width: 62px;
        height: 62px;
      }
      .choice-sign {
        font-size: 34px;
      }
      .choice-hint {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <div class="top-bar">
      <div class="buddy-picker" aria-label="Válassz kóstolót">
        <button class="buddy-btn active" data-buddy="🐊" title="Kroki">🐊</button>
        <button class="buddy-btn" data-buddy="🦖" title="Dínó">🦖</button>
        <button class="buddy-btn" data-buddy="🦈" title="Cápa">🦈</button>
        <button class="buddy-btn" data-buddy="🐉" title="Sárkány">🐉</button>
      </div>

      <div class="top-controls">
        <a href="index.html" class="icon-pill" title="Vissza a főoldalra">🏠 Főoldal</a>
        <button id="toggle-helper" class="icon-pill" title="Pöttyök mutatása vagy elrejtése">🍎 Pöttyök: BE</button>
        <button id="toggle-tts" class="icon-pill" title="Motiváló hangosbemondó be vagy ki" aria-pressed="true">🗣️ Beszéd: BE</button>
        <button id="toggle-sound" class="icon-pill" title="Hang be vagy ki">🔊</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="num">🔢 Számok</button>
      <button class="mode-btn" data-mode="add">➕ Összeadás</button>
      <button class="mode-btn" data-mode="sub">➖ Kivonás</button>
      <button class="mode-btn" data-mode="mix">🎲 Vegyes</button>
    </div>

    <div class="range-bar">
      <button class="range-btn active" data-range="1-10">1 – 10</button>
      <button class="range-btn" data-range="1-20">1 – 20</button>
      <button class="range-btn" data-range="1-100">🌟 1 – 100</button>
    </div>

    <div class="status-row">
      <div class="progress-track" id="progress-track"></div>
      <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>

    <section class="stage">
      <div class="speech-row">
        <div class="buddy-badge" id="buddy-badge">🐊</div>
        <div class="speech-bubble" id="speech-bubble">Hamm! A krokodil szája mindig a NAGYOBB felé nyílik!</div>
      </div>

      <div class="arena" aria-live="polite">
        <div class="side-card" id="left-card">
          <div class="side-value" id="left-val">5</div>
          <div class="side-dots" id="left-dots"></div>
        </div>

        <div class="croc-center" id="croc-center">
          <svg class="croc-svg" id="croc-svg" viewBox="0 0 100 100" aria-hidden="true"></svg>
          <span class="croc-sign-badge" id="croc-symbol">?</span>
        </div>

        <div class="side-card" id="right-card">
          <div class="side-value" id="right-val">8</div>
          <div class="side-dots" id="right-dots"></div>
        </div>
      </div>
    </section>

    <section class="choice-row" aria-label="Válassz jelet">
      <button class="choice-btn lt" data-choice="<">
        <span class="choice-sign">&lt;</span>
        <span class="choice-hint">A jobb nagyobb</span>
      </button>
      <button class="choice-btn eq" data-choice="=">
        <span class="choice-sign">=</span>
        <span class="choice-hint">Egyenlő</span>
      </button>
      <button class="choice-btn gt" data-choice=">">
        <span class="choice-sign">&gt;</span>
        <span class="choice-hint">A bal nagyobb</span>
      </button>
    </section>

    <div class="sticker-bar">
      <span class="sticker-label" id="sticker-label">🏆 Matricák (0):</span>
      <div class="sticker-list" id="sticker-list">Oldj meg 10-et egy matricáért!</div>
    </div>

    <div class="kb-hint">Tipp géphez: Használd a ◀, ▼ (vagy Space) és ▶ billentyűket is!</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">🐊</div>
      <h2 class="modal-title" id="modal-title">Kroki jóllakott!</h2>
      <p class="modal-text" id="modal-text">Megoldottál 10 feladatot és nyertél egy új matricát!</p>
      <button class="big-play-btn" id="play-again-btn">Újra! 🚀</button>
    </div>
  </div>

  <script>
    (() => {
      const ROUND_LENGTH = 10;
      const FOOD_ICONS = ["🍎", "🍓", "🍉", "🍪", "🧁", "🍌", "🍇", "🐟"];
      const STICKERS = ["🐊", "👑", "🚀", "🌈", "🍉", "🏆", "🦖", "🦈", "🌟", "🎨", "⚽", "🍕"];
      const PRAISE = [
        "Hamm! Pont a finomabb falat! 🐊",
        "Szuper szemmérték! 👀✨",
        "Kroki-bajnok! 🏆",
        "Telitalálat! Jöhet a következő! 🚀",
        "Ügyes vagy! Nyami! 🍎",
        "Villámgyors matek! ⚡",
        "Zseniális! 🌟",
        "Hűha, ez aztán a nagy falat! 🍉"
      ];
      const ENCOURAGE = [
        "Hoppá! Melyik oldalon van több? Nézd meg jól! 👀",
        "Majdnem! A krokodil a NAGYOBBAT akarja megenni! 🐊",
        "Próbáld újra! Számold meg a pöttyöket! 💪"
      ];

      let mode = "num"; // "num" | "add" | "sub" | "mix"
      let range = "1-10"; // "1-10" | "1-20" | "1-100"
      let buddy = "🐊";
      let showHelper = true;
      let soundOn = true;
      let ttsOn = true;

      let step = 0;
      let streak = 0;
      let locked = false;
      let leftVal = 0;
      let rightVal = 0;
      let foodIcon = "🍎";
      let stickers = [];

      try {
        stickers = JSON.parse(localStorage.getItem("matek_croc_stickers") || "[]");
      } catch (_) {
        stickers = [];
      }

      const buddyBadge = document.getElementById("buddy-badge");
      const speechBubble = document.getElementById("speech-bubble");
      const leftCard = document.getElementById("left-card");
      const rightCard = document.getElementById("right-card");
      const leftValEl = document.getElementById("left-val");
      const rightValEl = document.getElementById("right-val");
      const leftDots = document.getElementById("left-dots");
      const rightDots = document.getElementById("right-dots");
      const crocCenter = document.getElementById("croc-center");
      const crocSvg = document.getElementById("croc-svg");
      const crocSymbol = document.getElementById("croc-symbol");
      const progressTrack = document.getElementById("progress-track");
      const streakBadge = document.getElementById("streak-badge");
      const stickerLabel = document.getElementById("sticker-label");
      const stickerList = document.getElementById("sticker-list");
      const modal = document.getElementById("modal");
      const modalEmoji = document.getElementById("modal-emoji");
      const modalText = document.getElementById("modal-text");
      const toggleHelperBtn = document.getElementById("toggle-helper");
      const toggleTtsBtn = document.getElementById("toggle-tts");
      const toggleSoundBtn = document.getElementById("toggle-sound");

      function speakMotivation(text, opts = {}) {
        if (!soundOn || !ttsOn || !text) return;
        try {
          if (!("speechSynthesis" in window)) return;
          const clean = String(text)
            .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!clean) return;
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = "hu-HU";
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const match = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("hu"));
          if (match) utter.voice = match;
          utter.pitch = opts.pitch ?? 1.12;
          utter.rate = opts.rate ?? 1.02;
          window.speechSynthesis.speak(utter);
        } catch (_) {}
      }

      function renderCrocFace(state) {
        // state: "idle" | "<" | ">" | "="
        if (state === "<") {
          // Chomp right (mouth opens right)
          crocSvg.innerHTML = `
            <path d="M16 54 C16 28, 38 20, 60 22 L88 34 L54 50 L88 66 L60 78 C38 80, 16 72, 16 54 Z" fill="#51cf66" stroke="#1b4332" stroke-width="4" stroke-linejoin="round"/>
            <path d="M62 36 L68 43 L74 36 L80 43" fill="#fff" stroke="#1b4332" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M62 64 L68 57 L74 64 L80 57" fill="#fff" stroke="#1b4332" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="42" cy="28" r="8" fill="#fff" stroke="#1b4332" stroke-width="3"/>
            <circle cx="44" cy="28" r="3.5" fill="#1b4332"/>
          `;
        } else if (state === ">") {
          // Chomp left (mouth opens left)
          crocSvg.innerHTML = `
            <path d="M84 54 C84 28, 62 20, 40 22 L12 34 L46 50 L12 66 L40 78 C62 80, 84 72, 84 54 Z" fill="#51cf66" stroke="#1b4332" stroke-width="4" stroke-linejoin="round"/>
            <path d="M38 36 L32 43 L26 36 L20 43" fill="#fff" stroke="#1b4332" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M38 64 L32 57 L26 64 L20 57" fill="#fff" stroke="#1b4332" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="58" cy="28" r="8" fill="#fff" stroke="#1b4332" stroke-width="3"/>
            <circle cx="56" cy="28" r="3.5" fill="#1b4332"/>
          `;
        } else if (state === "=") {
          // Happy smile
          crocSvg.innerHTML = `
            <circle cx="50" cy="54" r="32" fill="#51cf66" stroke="#1b4332" stroke-width="4"/>
            <circle cx="38" cy="30" r="8.5" fill="#fff" stroke="#1b4332" stroke-width="3"/>
            <circle cx="62" cy="30" r="8.5" fill="#fff" stroke="#1b4332" stroke-width="3"/>
            <circle cx="38" cy="30" r="3.5" fill="#1b4332"/>
            <circle cx="62" cy="30" r="3.5" fill="#1b4332"/>
            <path d="M33 56 Q50 70 67 56" fill="none" stroke="#1b4332" stroke-width="4" stroke-linecap="round"/>
          `;
        } else {
          // Idle curious face
          crocSvg.innerHTML = `
            <circle cx="50" cy="54" r="30" fill="#51cf66" stroke="#1b4332" stroke-width="4"/>
            <circle cx="38" cy="32" r="8.5" fill="#fff" stroke="#1b4332" stroke-width="3"/>
            <circle cx="62" cy="32" r="8.5" fill="#fff" stroke="#1b4332" stroke-width="3"/>
            <circle cx="39" cy="32" r="3.5" fill="#1b4332"/>
            <circle cx="61" cy="32" r="3.5" fill="#1b4332"/>
            <path d="M38 58 L62 58" stroke="#1b4332" stroke-width="4" stroke-linecap="round"/>
          `;
        }
      }

      // Web Audio
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function tone(freq, dur, type = "triangle", gainVal = 0.08, delay = 0) {
        if (!soundOn) return;
        const ctx = getCtx();
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function playChompWin() {
        tone(340, 0.08, "square", 0.06, 0);
        tone(523, 0.11, "triangle", 0.09, 0.07);
        tone(659, 0.12, "triangle", 0.09, 0.16);
        tone(784, 0.18, "triangle", 0.09, 0.25);
      }

      function playWrong() {
        tone(240, 0.14, "sawtooth", 0.05, 0);
        tone(190, 0.18, "sawtooth", 0.05, 0.12);
      }

      function playFanfare() {
        [523, 659, 784, 1046].forEach((f, i) => {
          tone(f, 0.18, "triangle", 0.09, i * 0.1);
        });
      }

      // Confetti
      const canvas = document.getElementById("confetti-canvas");
      const ctx2d = canvas.getContext("2d");
      let particles = [];
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function burstConfetti(count = 45) {
        const colors = ["#ff6b6b", "#ffd43b", "#40c057", "#3bc9db", "#9b5de5"];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1
          });
        }
      }

      function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.32;
          p.rot += p.vrot;
          p.life -= 0.015;
          ctx2d.save();
          ctx2d.globalAlpha = p.life;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx2d.restore();
        }
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getMaxRange() {
        if (range === "1-10") return 10;
        if (range === "1-20") return 20;
        return 100;
      }

      function pickSideType() {
        if (mode === "num") return "num";
        if (mode === "add") return "add";
        if (mode === "sub") return "sub";
        const r = Math.random();
        if (r < 0.34) return "num";
        if (r < 0.67) return "add";
        return "sub";
      }

      function makeSide(type, maxNum, forcedVal = null) {
        if (type === "num") {
          const val = forcedVal !== null ? forcedVal : randInt(1, maxNum);
          return { val, text: String(val) };
        }
        if (type === "add") {
          const target = forcedVal !== null ? forcedVal : randInt(2, maxNum);
          if (target < 2) return { val: target, text: String(target) };
          const a = randInt(1, target - 1);
          const b = target - a;
          return { val: target, text: `${a} + ${b}` };
        }
        // "sub"
        const target = forcedVal !== null ? forcedVal : randInt(1, Math.max(1, maxNum - 1));
        if (target >= maxNum) return { val: target, text: String(target) };
        const b = randInt(1, maxNum - target);
        const a = target + b;
        return { val: target, text: `${a} - ${b}` };
      }

      function renderDots(container, val) {
        container.innerHTML = "";
        if (!showHelper) return;

        if (val <= 20) {
          for (let i = 0; i < val; i++) {
            const span = document.createElement("span");
            span.className = "food-dot";
            span.textContent = foodIcon;
            container.appendChild(span);
          }
        } else {
          const tens = Math.floor(val / 10);
          const ones = val % 10;
          for (let i = 0; i < tens; i++) {
            const blk = document.createElement("span");
            blk.className = "tens-block";
            blk.textContent = "10";
            container.appendChild(blk);
          }
          for (let i = 0; i < ones; i++) {
            const span = document.createElement("span");
            span.className = "food-dot";
            span.textContent = "•";
            container.appendChild(span);
          }
        }
      }

      function renderProgress() {
        progressTrack.innerHTML = "";
        for (let i = 0; i < ROUND_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "step-dot";
          if (i < step) dot.classList.add("done");
          else if (i === step) dot.classList.add("current");
          progressTrack.appendChild(dot);
        }
        streakBadge.textContent = `🔥 ${streak}`;
      }

      function renderStickers() {
        stickerLabel.textContent = `🏆 Matricák (${stickers.length}):`;
        if (stickers.length === 0) {
          stickerList.textContent = "Oldj meg 10-et egy matricáért!";
        } else {
          stickerList.textContent = stickers.join(" ");
        }
      }

      function nextProblem() {
        locked = false;
        const maxNum = getMaxRange();
        foodIcon = FOOD_ICONS[randInt(0, FOOD_ICONS.length - 1)];

        leftCard.classList.remove("winner", "shake");
        rightCard.classList.remove("winner", "shake");
        crocCenter.classList.remove("correct", "wrong");
        crocSymbol.textContent = "?";
        renderCrocFace("idle");

        const forceEqual = Math.random() < 0.22;
        const left = makeSide(pickSideType(), maxNum);
        const right = forceEqual
          ? makeSide(pickSideType(), maxNum, left.val)
          : makeSide(pickSideType(), maxNum);

        leftVal = left.val;
        rightVal = right.val;

        leftValEl.textContent = left.text;
        rightValEl.textContent = right.text;
        renderDots(leftDots, leftVal);
        renderDots(rightDots, rightVal);
        renderProgress();
      }

      function handleChoice(choice) {
        if (locked) return;

        let expected = "=";
        if (leftVal < rightVal) expected = "<";
        else if (leftVal > rightVal) expected = ">";

        if (choice === expected) {
          locked = true;
          streak++;
          step++;
          crocSymbol.textContent = expected;
          renderCrocFace(expected);
          crocCenter.classList.remove("wrong");
          crocCenter.classList.add("correct");

          if (expected === ">") leftCard.classList.add("winner");
          else if (expected === "<") rightCard.classList.add("winner");
          else {
            leftCard.classList.add("winner");
            rightCard.classList.add("winner");
          }

          buddyBadge.classList.remove("chomp");
          void buddyBadge.offsetWidth;
          buddyBadge.classList.add("chomp");

          const msg = PRAISE[randInt(0, PRAISE.length - 1)];
          speechBubble.textContent = msg;
          playChompWin();
          speakMotivation(msg);
          burstConfetti(35);
          renderProgress();

          setTimeout(() => {
            if (step >= ROUND_LENGTH) {
              finishRound();
            } else {
              nextProblem();
            }
          }, 1050);
        } else {
          streak = 0;
          crocCenter.classList.remove("wrong");
          void crocCenter.offsetWidth;
          crocCenter.classList.add("wrong");
          leftCard.classList.add("shake");
          rightCard.classList.add("shake");
          setTimeout(() => {
            leftCard.classList.remove("shake");
            rightCard.classList.remove("shake");
          }, 380);
          const msg = ENCOURAGE[randInt(0, ENCOURAGE.length - 1)];
          speechBubble.textContent = msg;
          playWrong();
          speakMotivation(msg, { pitch: 1.0, rate: 0.98 });
          renderProgress();
        }
      }

      function finishRound() {
        const newSticker = STICKERS[stickers.length % STICKERS.length];
        stickers.push(newSticker);
        try {
          localStorage.setItem("matek_croc_stickers", JSON.stringify(stickers));
        } catch (_) {}
        renderStickers();
        modalEmoji.textContent = newSticker;
        const msg = `Megoldottál ${ROUND_LENGTH} feladatot és nyertél egy új matricát!`;
        modalText.textContent = `${msg} ${newSticker}`;
        modal.classList.add("open");
        burstConfetti(90);
        playFanfare();
        speakMotivation("Szuper vagy! Kroki jóllakott, nyertél egy új matricát!");
      }

      document.querySelectorAll(".buddy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".buddy-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          buddy = btn.dataset.buddy;
          buddyBadge.textContent = buddy;
          tone(520, 0.08, "triangle", 0.06);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          range = btn.dataset.range;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".choice-btn").forEach((btn) => {
        btn.addEventListener("click", () => handleChoice(btn.dataset.choice));
      });

      toggleHelperBtn.addEventListener("click", () => {
        showHelper = !showHelper;
        toggleHelperBtn.textContent = showHelper ? "🍎 Pöttyök: BE" : "🍎 Pöttyök: KI";
        renderDots(leftDots, leftVal);
        renderDots(rightDots, rightVal);
      });

      toggleTtsBtn.addEventListener("click", () => {
        ttsOn = !ttsOn;
        toggleTtsBtn.textContent = ttsOn ? "🗣️ Beszéd: BE" : "🗣️ Beszéd: KI";
        toggleTtsBtn.setAttribute("aria-pressed", String(ttsOn));
        if (!ttsOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (ttsOn) {
          speakMotivation("Szia! Etessük meg Krokot!");
        }
      });

      toggleSoundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        toggleSoundBtn.textContent = soundOn ? "🔊" : "🔇";
        if (!soundOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (soundOn) {
          tone(600, 0.08, "triangle", 0.06);
        }
      });

      document.getElementById("play-again-btn").addEventListener("click", () => {
        modal.classList.remove("open");
        step = 0;
        nextProblem();
      });

      window.addEventListener("keydown", (e) => {
        if (modal.classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") {
            modal.classList.remove("open");
            step = 0;
            nextProblem();
          }
          return;
        }
        if (e.key === "ArrowLeft" || e.key === "<") {
          handleChoice("<");
        } else if (e.key === "ArrowRight" || e.key === ">") {
          handleChoice(">");
        } else if (e.key === "ArrowDown" || e.key === "=" || e.key === " ") {
          e.preventDefault();
          handleChoice("=");
        }
      });

      renderStickers();
      nextProblem();
    })();
  </script>
</body>
</html>
