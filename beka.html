<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Béka Ugrás! — Számsorok és Ugróiskola</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#339af0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MatekAppok" />
  <style>
    :root {
      --sky: #74c0fc;
      --pond-top: #4dabf7;
      --pond-bot: #1864ab;
      --card: #f8fcff;
      --ink: #183153;
      --ink-soft: #4c6482;
      --lily: #69db7c;
      --lily-dark: #2f9e44;
      --sun: #ffd43b;
      --coral: #ff6b6b;
      --water-light: #d0ebff;
      --water-mid: #a5d8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Comic Sans MS", "Chalkboard SE", "Fredoka", "Nunito", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      touch-action: manipulation;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 20%, rgba(255, 255, 255, 0.25) 0 36px, transparent 37px),
        radial-gradient(circle at 86% 18%, rgba(255, 255, 255, 0.22) 0 48px, transparent 49px),
        radial-gradient(circle at 20% 82%, rgba(105, 219, 124, 0.26) 0 44px, transparent 45px),
        linear-gradient(175deg, var(--sky) 0%, var(--pond-top) 48%, var(--pond-bot) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px 12px;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .app {
      width: 100%;
      max-width: 660px;
      background: var(--card);
      border-radius: 30px;
      border: 4px solid var(--ink);
      box-shadow: 0 10px 0 var(--ink), 0 20px 42px rgba(24, 49, 83, 0.3);
      padding: 16px;
      position: relative;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .buddy-picker {
      display: flex;
      gap: 5px;
      background: #e7f5ff;
      border: 2.5px solid var(--ink);
      padding: 4px;
      border-radius: 999px;
    }

    .buddy-btn {
      border: none;
      background: transparent;
      font-size: 21px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s, background 0.15s;
    }

    .buddy-btn.active {
      background: var(--sun);
      transform: scale(1.1);
      box-shadow: 0 2px 0 var(--ink);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-pill {
      border: 2.5px solid var(--ink);
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-weight: 800;
      font-size: 13px;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 3px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
    }

    .icon-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Mode & Range Selectors */
    .mode-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 9px;
    }

    .range-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 11px;
    }

    .mode-btn, .range-btn {
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 9px 4px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      background: #ffffff;
      color: var(--ink);
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
    }

    .range-btn {
      padding: 7px 6px;
      font-size: 14px;
    }

    .mode-btn.active {
      background: var(--lily);
      color: var(--ink);
    }

    .range-btn.active {
      background: #339af0;
      color: #ffffff;
    }

    .mode-btn:active, .range-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 var(--ink);
    }

    /* Progress & Streak */
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .progress-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      background: #e7f5ff;
      border: 2.5px solid var(--ink);
      padding: 5px 8px;
      border-radius: 999px;
    }

    .step-dot {
      flex: 1;
      height: 11px;
      border-radius: 999px;
      background: #bae6fd;
      transition: background 0.25s, transform 0.25s;
    }

    .step-dot.done {
      background: var(--lily-dark);
      transform: scaleY(1.15);
    }

    .step-dot.current {
      background: var(--sun);
      animation: pulse 1.1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .streak-badge {
      background: var(--sun);
      border: 2.5px solid var(--ink);
      color: var(--ink);
      font-weight: 900;
      font-size: 14px;
      padding: 5px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 var(--ink);
      white-space: nowrap;
    }

    /* Pond Stage */
    .stage {
      background: linear-gradient(180deg, var(--water-light) 0%, var(--water-mid) 100%);
      border-radius: 24px;
      padding: 14px 10px 18px;
      text-align: center;
      margin-bottom: 14px;
      border: 3px solid var(--ink);
      position: relative;
      overflow: hidden;
    }

    .speech-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .buddy-badge {
      font-size: 34px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .buddy-badge.hop {
      animation: frogHop 0.45s ease;
    }

    @keyframes frogHop {
      0% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-16px) scale(1.2); }
      100% { transform: translateY(0) scale(1); }
    }

    .speech-bubble {
      background: #ffffff;
      border: 2.5px solid var(--ink);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 14.5px;
      font-weight: 800;
      color: var(--ink);
      box-shadow: 0 3px 0 rgba(24, 49, 83, 0.14);
      max-width: 460px;
    }

    .rule-pill {
      display: inline-block;
      background: var(--sun);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 14px;
      box-shadow: 0 3px 0 var(--ink);
    }

    .rule-pill.hidden {
      display: none;
    }

    /* Lilypad Row */
    .pond-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      align-items: center;
      padding: 6px 2px;
    }

    .lilypad {
      background: radial-gradient(circle at 35% 35%, #8ce99a 0%, var(--lily) 65%, #40c057 100%);
      border: 3px solid var(--ink);
      border-radius: 50% 50% 46% 46% / 44% 44% 56% 56%;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 6px 0 var(--lily-dark);
      transition: transform 0.25s, background 0.25s;
    }

    .lilypad.target {
      background: radial-gradient(circle at 35% 35%, #fff3bf 0%, #ffe066 75%);
      border-style: dashed;
      box-shadow: 0 6px 0 #e6b400;
      animation: pulse 1.2s infinite;
    }

    .lilypad.solved {
      background: radial-gradient(circle at 35% 35%, #b2f2bb 0%, #51cf66 75%);
      border-style: solid;
      box-shadow: 0 6px 0 var(--lily-dark);
      animation: none;
      transform: scale(1.06);
    }

    .lily-num {
      font-size: clamp(1.35rem, 4vw, 1.95rem);
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
    }

    .lily-frog {
      font-size: 24px;
      position: absolute;
      top: -18px;
      filter: drop-shadow(0 2px 0 rgba(0,0,0,0.2));
      transition: transform 0.3s;
    }

    /* Choice Buttons */
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .choice-btn {
      border: 3px solid var(--ink);
      border-radius: 20px;
      background: #ffffff;
      color: var(--ink);
      font-family: inherit;
      font-size: 26px;
      font-weight: 900;
      padding: 14px 6px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
      position: relative;
    }

    .choice-btn:hover {
      background: #ebfbee;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--ink);
    }

    .choice-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .choice-btn.wrong {
      background: #ffe3e3;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Sticker Bar */
    .sticker-bar {
      background: #e7f5ff;
      border: 2.5px solid var(--ink);
      border-radius: 18px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .sticker-label {
      font-weight: 900;
      font-size: 14px;
      white-space: nowrap;
    }

    .sticker-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 20px;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .kb-hint {
      text-align: center;
      font-size: 12px;
      color: var(--ink-soft);
      font-weight: 800;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(24, 49, 83, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: var(--card);
      border-radius: 28px;
      border: 4px solid var(--ink);
      box-shadow: 0 12px 0 var(--ink);
      padding: 26px 22px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% { transform: scale(0.75); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-emoji {
      font-size: 62px;
      margin-bottom: 6px;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .modal-text {
      margin: 0 0 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .big-play-btn {
      border: 3px solid var(--ink);
      border-radius: 999px;
      background: var(--lily);
      color: var(--ink);
      font-family: inherit;
      font-size: 20px;
      font-weight: 900;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--ink);
      transition: transform 0.1s;
    }

    .big-play-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @media (max-width: 540px) {
      .mode-bar {
        grid-template-columns: repeat(3, 1fr);
      }
      .choice-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .lilypad {
        min-height: 68px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app">
    <div class="top-bar">
      <div class="buddy-picker" aria-label="Válassz ugróbajnokot">
        <button class="buddy-btn active" data-buddy="🐸" title="Béka">🐸</button>
        <button class="buddy-btn" data-buddy="🐢" title="Teknős">🐢</button>
        <button class="buddy-btn" data-buddy="🦆" title="Kacsa">🦆</button>
        <button class="buddy-btn" data-buddy="🐝" title="Méhecske">🐝</button>
      </div>

      <div class="top-controls">
        <a href="index.html" class="icon-pill" title="Vissza a főoldalra">🏠 Főoldal</a>
        <button id="toggle-helper" class="icon-pill" title="Ugrás-szabály mutatása vagy elrejtése">📏 Szabály: BE</button>
        <button id="toggle-tts" class="icon-pill" title="Motiváló hangosbemondó be vagy ki" aria-pressed="true">🗣️ Beszéd: BE</button>
        <button id="toggle-sound" class="icon-pill" title="Hang be vagy ki">🔊</button>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="p2">⏩ +2 ugrás</button>
      <button class="mode-btn" data-mode="p5">🖐️ +5 ugrás</button>
      <button class="mode-btn" data-mode="p10">🔟 +10 ugrás</button>
      <button class="mode-btn" data-mode="back">⏪ Visszafelé</button>
      <button class="mode-btn" data-mode="mix">🎲 Vegyes</button>
    </div>

    <div class="range-bar">
      <button class="range-btn active" data-range="1-20">1 – 20</button>
      <button class="range-btn" data-range="1-50">1 – 50</button>
      <button class="range-btn" data-range="1-100">🌟 1 – 100</button>
    </div>

    <div class="status-row">
      <div class="progress-track" id="progress-track"></div>
      <div class="streak-badge" id="streak-badge">🔥 0</div>
    </div>

    <section class="stage">
      <div class="speech-row">
        <div class="buddy-badge" id="buddy-badge">🐸</div>
        <div class="speech-bubble" id="speech-bubble">Brekeke! Segíts a békának átugrani a hiányzó tavirózsára!</div>
      </div>

      <div class="rule-pill" id="rule-pill">Ugrás: +2</div>

      <div class="pond-row" id="pond-row" aria-live="polite"></div>
    </section>

    <section class="choice-grid" id="choice-grid" aria-label="Válassz számot"></section>

    <div class="sticker-bar">
      <span class="sticker-label" id="sticker-label">🏆 Matricák (0):</span>
      <div class="sticker-list" id="sticker-list">Oldj meg 10-et egy matricáért!</div>
    </div>

    <div class="kb-hint">Tipp géphez: Használd az 1, 2, 3, 4 billentyűket a gyors ugráshoz!</div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-emoji" id="modal-emoji">🐸</div>
      <h2 class="modal-title" id="modal-title">Átugrottunk a tavon!</h2>
      <p class="modal-text" id="modal-text">Megoldottál 10 feladatot és nyertél egy új matricát!</p>
      <button class="big-play-btn" id="play-again-btn">Újra! 🚀</button>
    </div>
  </div>

  <script>
    (() => {
      const ROUND_LENGTH = 10;
      const STICKERS = ["🐸", "🪷", "🏆", "🚀", "🌈", "🐢", "🦆", "🐝", "🌟", "👑", "🎨", "⚽"];
      const PRAISE = [
        "Brekeke! Szuper ugrás! 🐸✨",
        "Csobbanás nélkül a célba ért! 🪷",
        "Tavirózsa-bajnok! 🏆",
        "Villámgyors számolás! ⚡",
        "Ügyes vagy! Jöhet a következő ugrás! 🚀",
        "Zseniális számsor! 🌟"
      ];
      const ENCOURAGE = [
        "Hoppá! Csobbantunk a vízbe! Nézd meg, mennyivel ugrunk! 💧",
        "Majdnem! Számold meg még egyszer az ugrást! 👀",
        "Próbálj egy másik tavirózsát! 💪"
      ];

      let mode = "p2"; // "p2" | "p5" | "p10" | "back" | "mix"
      let range = "1-20"; // "1-20" | "1-50" | "1-100"
      let buddy = "🐸";
      let showHelper = true;
      let soundOn = true;
      let ttsOn = true;

      let step = 0;
      let streak = 0;
      let locked = false;
      let problem = null; // { seq, missingIdx, delta, answer, choices }
      let stickers = [];

      try {
        stickers = JSON.parse(localStorage.getItem("matek_frog_stickers") || "[]");
      } catch (_) {
        stickers = [];
      }

      const buddyBadge = document.getElementById("buddy-badge");
      const speechBubble = document.getElementById("speech-bubble");
      const rulePill = document.getElementById("rule-pill");
      const pondRow = document.getElementById("pond-row");
      const choiceGrid = document.getElementById("choice-grid");
      const progressTrack = document.getElementById("progress-track");
      const streakBadge = document.getElementById("streak-badge");
      const stickerLabel = document.getElementById("sticker-label");
      const stickerList = document.getElementById("sticker-list");
      const modal = document.getElementById("modal");
      const modalEmoji = document.getElementById("modal-emoji");
      const modalText = document.getElementById("modal-text");
      const toggleHelperBtn = document.getElementById("toggle-helper");
      const toggleTtsBtn = document.getElementById("toggle-tts");
      const toggleSoundBtn = document.getElementById("toggle-sound");

      function speakMotivation(text, opts = {}) {
        if (!soundOn || !ttsOn || !text) return;
        try {
          if (!("speechSynthesis" in window)) return;
          const clean = String(text)
            .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
            .replace(/\s+/g, " ")
            .trim();
          if (!clean) return;
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          utter.lang = "hu-HU";
          const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
          const match = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("hu"));
          if (match) utter.voice = match;
          utter.pitch = opts.pitch ?? 1.12;
          utter.rate = opts.rate ?? 1.02;
          window.speechSynthesis.speak(utter);
        } catch (_) {}
      }

      // Web Audio
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) audioCtx = new Ctx();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      function tone(freq, dur, type = "triangle", gainVal = 0.08, delay = 0) {
        if (!soundOn) return;
        const ctx = getCtx();
        if (!ctx) return;
        const t = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function playHopWin() {
        tone(392, 0.08, "sine", 0.08, 0);
        tone(523, 0.09, "sine", 0.09, 0.07);
        tone(659, 0.12, "triangle", 0.09, 0.14);
        tone(784, 0.16, "triangle", 0.09, 0.22);
      }

      function playSplash() {
        tone(220, 0.12, "sawtooth", 0.05, 0);
        tone(160, 0.16, "sawtooth", 0.05, 0.1);
      }

      function playFanfare() {
        [523, 659, 784, 1046].forEach((f, i) => {
          tone(f, 0.18, "triangle", 0.09, i * 0.1);
        });
      }

      // Confetti
      const canvas = document.getElementById("confetti-canvas");
      const ctx2d = canvas.getContext("2d");
      let particles = [];
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      function burstConfetti(count = 45) {
        const colors = ["#69db7c", "#ffd43b", "#339af0", "#ff6b6b", "#9b5de5"];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: canvas.width / 2 + (Math.random() - 0.5) * 180,
            y: canvas.height * 0.45,
            vx: (Math.random() - 0.5) * 11,
            vy: -Math.random() * 10 - 3,
            size: Math.random() * 7 + 5,
            color: colors[i % colors.length],
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1
          });
        }
      }

      function animateConfetti() {
        ctx2d.clearRect(0, 0, canvas.width, canvas.height);
        particles = particles.filter((p) => p.life > 0.02);
        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.32;
          p.rot += p.vrot;
          p.life -= 0.015;
          ctx2d.save();
          ctx2d.globalAlpha = p.life;
          ctx2d.translate(p.x, p.y);
          ctx2d.rotate(p.rot);
          ctx2d.fillStyle = p.color;
          ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
          ctx2d.restore();
        }
        requestAnimationFrame(animateConfetti);
      }
      animateConfetti();

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function getMaxNum() {
        if (range === "1-20") return 20;
        if (range === "1-50") return 50;
        return 100;
      }

      function generateProblem() {
        const maxNum = getMaxNum();
        let active = mode;
        if (active === "mix") {
          const opts = ["p2", "p5", "p10", "back"];
          active = opts[randInt(0, opts.length - 1)];
        }

        let delta = 2;
        if (active === "p2") delta = 2;
        else if (active === "p5") delta = 5;
        else if (active === "p10") delta = maxNum >= 50 ? 10 : 5;
        else if (active === "back") {
          const steps = maxNum >= 50 ? [-2, -5, -10] : [-1, -2, -5];
          delta = steps[randInt(0, steps.length - 1)];
        }

        let start = 0;
        if (delta > 0) {
          const maxStart = Math.max(0, maxNum - delta * 4);
          if (delta === 10) {
            start = randInt(0, Math.floor(maxStart / 10)) * 10;
          } else if (delta === 5) {
            start = randInt(0, Math.floor(maxStart / 5)) * 5;
          } else {
            start = randInt(0, Math.floor(maxStart / 2)) * 2;
          }
        } else {
          const minStart = Math.abs(delta) * 4;
          const stepAbs = Math.abs(delta);
          const lowK = Math.ceil(minStart / stepAbs);
          const highK = Math.floor(maxNum / stepAbs);
          start = randInt(lowK, Math.max(lowK, highK)) * stepAbs;
        }

        const seq = Array.from({ length: 5 }, (_, i) => start + i * delta);
        const missingIdx = randInt(2, 4);
        const answer = seq[missingIdx];

        const choices = new Set([answer]);
        const offsets = [-delta, delta, -1, 1, -2, 2, -5, 5];
        let guard = 0;
        while (choices.size < 4 && guard < 40) {
          guard++;
          const off = offsets[randInt(0, offsets.length - 1)];
          const cand = answer + off;
          if (cand >= 0 && cand <= maxNum + 10) {
            choices.add(cand);
          }
        }
        while (choices.size < 4) {
          choices.add(answer + choices.size);
        }

        return {
          seq,
          missingIdx,
          delta,
          answer,
          choices: [...choices].sort((a, b) => a - b)
        };
      }

      function renderPond(solved = false) {
        pondRow.innerHTML = "";
        problem.seq.forEach((val, idx) => {
          const pad = document.createElement("div");
          pad.className = "lilypad";
          const isTarget = idx === problem.missingIdx;
          if (isTarget) {
            pad.classList.add(solved ? "solved" : "target");
          }

          const frogIdx = solved ? problem.missingIdx : problem.missingIdx - 1;
          if (idx === frogIdx) {
            const frog = document.createElement("span");
            frog.className = "lily-frog";
            frog.textContent = buddy;
            pad.appendChild(frog);
          }

          const num = document.createElement("span");
          num.className = "lily-num";
          num.textContent = isTarget && !solved ? "?" : String(val);
          pad.appendChild(num);

          pondRow.appendChild(pad);
        });

        if (showHelper) {
          rulePill.classList.remove("hidden");
          rulePill.textContent = `Ugrás: ${problem.delta > 0 ? "+" + problem.delta : problem.delta}`;
        } else {
          rulePill.classList.add("hidden");
        }
      }

      function renderChoices() {
        choiceGrid.innerHTML = "";
        problem.choices.forEach((val, idx) => {
          const btn = document.createElement("button");
          btn.className = "choice-btn";
          btn.textContent = String(val);
          btn.dataset.idx = String(idx);
          btn.addEventListener("click", () => handleChoice(val, btn));
          choiceGrid.appendChild(btn);
        });
      }

      function renderProgress() {
        progressTrack.innerHTML = "";
        for (let i = 0; i < ROUND_LENGTH; i++) {
          const dot = document.createElement("div");
          dot.className = "step-dot";
          if (i < step) dot.classList.add("done");
          else if (i === step) dot.classList.add("current");
          progressTrack.appendChild(dot);
        }
        streakBadge.textContent = `🔥 ${streak}`;
      }

      function renderStickers() {
        stickerLabel.textContent = `🏆 Matricák (${stickers.length}):`;
        if (stickers.length === 0) {
          stickerList.textContent = "Oldj meg 10-et egy matricáért!";
        } else {
          stickerList.textContent = stickers.join(" ");
        }
      }

      function nextProblem() {
        locked = false;
        problem = generateProblem();
        renderPond(false);
        renderChoices();
        renderProgress();
      }

      function handleChoice(val, btnEl) {
        if (locked) return;

        if (val === problem.answer) {
          locked = true;
          streak++;
          step++;
          renderPond(true);

          buddyBadge.classList.remove("hop");
          void buddyBadge.offsetWidth;
          buddyBadge.classList.add("hop");

          const msg = PRAISE[randInt(0, PRAISE.length - 1)];
          speechBubble.textContent = msg;
          playHopWin();
          speakMotivation(msg);
          burstConfetti(35);
          renderProgress();

          setTimeout(() => {
            if (step >= ROUND_LENGTH) {
              finishRound();
            } else {
              nextProblem();
            }
          }, 1050);
        } else {
          streak = 0;
          if (btnEl) {
            btnEl.classList.remove("wrong");
            void btnEl.offsetWidth;
            btnEl.classList.add("wrong");
          }
          const msg = ENCOURAGE[randInt(0, ENCOURAGE.length - 1)];
          speechBubble.textContent = msg;
          playSplash();
          speakMotivation(msg, { pitch: 1.0, rate: 0.98 });
          renderProgress();
        }
      }

      function finishRound() {
        const newSticker = STICKERS[stickers.length % STICKERS.length];
        stickers.push(newSticker);
        try {
          localStorage.setItem("matek_frog_stickers", JSON.stringify(stickers));
        } catch (_) {}
        renderStickers();
        modalEmoji.textContent = newSticker;
        modalText.textContent = `Megoldottál ${ROUND_LENGTH} feladatot és nyertél egy új matricát: ${newSticker}`;
        modal.classList.add("open");
        burstConfetti(90);
        playFanfare();
        speakMotivation("Brekeke! Átugrottunk a tavon, nyertél egy új matricát!");
      }

      document.querySelectorAll(".buddy-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".buddy-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          buddy = btn.dataset.buddy;
          buddyBadge.textContent = buddy;
          renderPond(false);
          tone(520, 0.08, "triangle", 0.06);
        });
      });

      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".mode-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          mode = btn.dataset.mode;
          step = 0;
          nextProblem();
        });
      });

      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".range-btn").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          range = btn.dataset.range;
          step = 0;
          nextProblem();
        });
      });

      toggleHelperBtn.addEventListener("click", () => {
        showHelper = !showHelper;
        toggleHelperBtn.textContent = showHelper ? "📏 Szabály: BE" : "📏 Szabály: KI";
        renderPond(false);
      });

      toggleTtsBtn.addEventListener("click", () => {
        ttsOn = !ttsOn;
        toggleTtsBtn.textContent = ttsOn ? "🗣️ Beszéd: BE" : "🗣️ Beszéd: KI";
        toggleTtsBtn.setAttribute("aria-pressed", String(ttsOn));
        if (!ttsOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (ttsOn) {
          speakMotivation("Brekeke! Ugorjunk át a tavon!");
        }
      });

      toggleSoundBtn.addEventListener("click", () => {
        soundOn = !soundOn;
        toggleSoundBtn.textContent = soundOn ? "🔊" : "🔇";
        if (!soundOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        } else if (soundOn) {
          tone(600, 0.08, "triangle", 0.06);
        }
      });

      document.getElementById("play-again-btn").addEventListener("click", () => {
        modal.classList.remove("open");
        step = 0;
        nextProblem();
      });

      window.addEventListener("keydown", (e) => {
        if (modal.classList.contains("open")) {
          if (e.key === "Enter" || e.key === " ") {
            modal.classList.remove("open");
            step = 0;
            nextProblem();
          }
          return;
        }
        if (["1", "2", "3", "4"].includes(e.key)) {
          const idx = Number(e.key) - 1;
          const btn = choiceGrid.children[idx];
          if (btn && problem.choices[idx] !== undefined) {
            handleChoice(problem.choices[idx], btn);
          }
        }
      });

      renderStickers();
      nextProblem();
    })();
  </script>
</body>
</html>
